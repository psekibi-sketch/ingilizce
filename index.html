<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #111b21;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .kart {
      background: #1e2c34;
      border: 2px solid #33444f;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .ust-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .etiket {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .sayac {
      display: flex;
      gap: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .soru-satiri {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .soru-baslik {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.3;
    }
    .ses-btn {
      background: #38bdf8;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ses-btn:active { transform: scale(0.92); }
    .ipucu-link {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 14px;
    }
    .ipucu-kutu {
      display: none;
      background: #152229;
      border: 1px dashed #475569;
      color: #facc15;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .secenekler-kutusu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .secenek-btn {
      background: #273740;
      border: 2px solid #3b4e5a;
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    .secenek-btn:active { transform: translateY(1px); }
    .secenek-btn.dogru {
      border-color: #22c55e !important;
      background: #143521 !important;
      color: #22c55e !important;
    }
    .secenek-btn.yanlis {
      border-color: #ef4444 !important;
      background: #3b1818 !important;
      color: #ef4444 !important;
    }
    .mesaj-kutusu {
      display: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .mesaj-kutusu.d-ok {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }
    .mesaj-kutusu.d-err {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .ana-btn {
      display: none;
      width: 100%;
      background: #22c55e;
      border: none;
      color: #0b1e11;
      font-size: 16px;
      font-weight: bold;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="kart" id="ana-kart">
  <div class="ust-bar">
    <span class="etiket" id="tur-yazisi">TÜRKÇE ➔ İNGİLİZCE</span>
    <div class="sayac">
      <span id="sayac" style="color: #4ade80;">Kalan: 20</span>
      <span id="canlar" style="color: #ef4444;">❤️ 5</span>
    </div>
  </div>

  <div class="soru-satiri">
    <div class="soru-baslik" id="soru-basligi">...</div>
    <button class="ses-btn" id="ses-btn" type="button">🔊</button>
  </div>
  
  <span class="ipucu-link" id="ipucu-btn">💡 İpucu ister misin?</span>
  <div class="ipucu-kutu" id="ipucu-kutu"></div>

  <!-- 4 şık doğrudan JavaScript ile buraya üretilir -->
  <div class="secenekler-kutusu" id="secenekler-alani"></div>

  <div class="mesaj-kutusu" id="mesaj-alani"></div>
  <button class="ana-btn" id="devam-btn" type="button">DEVAM ET</button>
</div>

    { en: 'Sunday', tr: 'Pazar', ipucu: 'Sun-day (Güneş günü) - Dinlenme günü' }
  ];
