<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #111b21;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .panel {
      background: #1e2c34;
      border: 2px solid #33444f;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .ust-serit {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .tur-etiketi {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .sayac-can {
      display: flex;
      gap: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .soru-alani {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }
    .soru-yazisi {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.3;
      flex: 1;
    }
    .ses-tusu {
      background: #38bdf8;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ses-tusu:active { transform: scale(0.92); }
    .ipucu-tusu {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 12px;
    }
    .ipucu-kutusu {
      display: none;
      background: #152229;
      border: 1px dashed #475569;
      color: #facc15;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .liste {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .secenek-butonu {
      background: #273740;
      border: 2px solid #3b4e5a;
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .secenek-butonu:active { transform: translateY(1px); }
    .secenek-butonu.dogru-renk {
      border-color: #22c55e !important;
      background: #143521 !important;
      color: #22c55e !important;
    }
    .secenek-butonu.yanlis-renk {
      border-color: #ef4444 !important;
      background: #3b1818 !important;
      color: #ef4444 !important;
    }
    .bildirim-kutusu {
      display: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .bildirim-kutusu.d-ok {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }
    .bildirim-kutusu.d-err {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .onay-butonu {
      display: none;
      width: 100%;
      background: #22c55e;
      border: none;
      color: #0b1e11;
      font-size: 16px;
      font-weight: bold;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .onay-butonu:active { transform: scale(0.98); }
  </style>
</head>
<body>

<div class="panel">
  <div class="ust-serit">
    <span class="tur-etiketi" id="tur-yazisi">TÜRKÇE ➔ İNGİLİZCE</span>
    <div class="sayac-can">
      <span id="sayac" style="color: #4ade80;">Kalan: 20</span>
      <span id="canlar" style="color: #ef4444;">❤️ 5</span>
    </div>
  </div>

  <div id="ana-bolum">
    <div class="soru-alani">
      <div class="soru-yazisi" id="soru-basligi">"Pazartesi" hangisidir?</div>
      <button class="ses-tusu" id="ses-tusu" type="button">🔊</button>
    </div>
    
    <span class="ipucu-tusu" id="ipucu-btn">💡 İpucu ister misin?</span>
    <div class="ipucu-kutusu" id="ipucu-yazisi"></div>
