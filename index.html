<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İngilizce Günler - Öğren ve Pekiştir</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .progress-bar-bg {
      background: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Ezber / Öğrenme Kartları */
    .learn-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0 24px;
      max-height: 58vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .day-card {
      background: #273549;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .day-card:active { transform: scale(0.98); }
    .day-card:hover { border-color: var(--accent); }
    .day-left { display: flex; flex-direction: column; gap: 3px; }
    .day-en { font-size: 18px; font-weight: 700; color: #fff; }
    .day-tr { font-size: 14px; color: var(--accent); font-weight: 600; }
    .day-hint { font-size: 12px; color: var(--text-muted); font-style: italic; }
    .btn-speaker {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Test Alanı */
    .question-prompt {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn-opt {
      background: #273549;
      color: var(--text);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 16px 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn-opt:active { transform: scale(0.98); }
    .btn-opt.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: var(--success); }
    .btn-opt.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: var(--error); }
    
    .action-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }
    .btn-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 28px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      transition: all 0.2s;
    }
    .btn-circle:active { transform: scale(0.94); }
    .btn-circle.listening {
      background: var(--error);
      box-shadow: 0 0 0 10px rgba(239, 68, 68, 0.3);
      animation: pulse 1.5s infinite;
      color: white;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .feedback-box {
      min-height: 48px;
      font-weight: 600;
      font-size: 15px;
      text-align: center;
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .feedback-tip {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: normal;
    }
    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-main:active { opacity: 0.9; }
    .btn-secondary {
      width: 100%;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .result-score { font-size: 52px; font-weight: 800; color: var(--accent); margin: 12px 0 6px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. BÖLÜM: EZBERLE VE ÖĞREN EKRANI -->
  <div id="learn-area">
    <div style="text-align: center;">
      <span class="badge">Adım 1: Keşfet & Dinle</span>
      <h2 style="font-size: 22px; margin-bottom: 6px;">Haftanın Günlerini Ezberle</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Her güne tıklayarak sesli dinleyin ve ipucunu okuyun.</p>
    </div>

    <div class="learn-grid" id="learn-cards"></div>

    <button class="btn-main" onclick="startPractice()">🚀 Hazırım, Pratik Yapalım (20 Soru)</button>
  </div>

  <!-- 2. BÖLÜM: PRATİK & SORU EKRANI -->
  <div id="quiz-area" style="display: none;">
    <div class="header">
      <span id="question-index">Soru 1 / 20</span>
      <span id="score-counter">Doğru: 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progress-bar"></div>
    </div>

    <div style="text-align: center;"><span class="badge" id="type-badge">Çeviri</span></div>
    <div class="question-prompt" id="prompt-text">Loading...</div>

    <div class="action-panel" id="action-panel" style="display: none;">
      <button class="btn-circle" id="action-btn" aria-label="Eylem">🔊</button>
      <div style="font-size: 13px; color: var(--text-muted);" id="action-hint">Dinlemek için dokunun</div>
    </div>

    <div class="options-grid" id="options-container"></div>
    
    <div class="feedback-box" id="feedback-text"></div>
    <button class="btn-main" id="next-btn" style="display: none;" onclick="nextQuestion()">Sonraki ➔</button>
  </div>

  <!-- 3. BÖLÜM: SONUÇ VE PEKİŞTİRME EKRANI -->
  <div id="result-area" style="display: none; text-align: center;">
    <span class="badge">Sonuç</span>
    <h2 style="font-size: 24px;">Tebrikler, Tamamladın!</h2>
    <div class="result-score" id="percent-text">%0</div>
    <p id="result-summary" style="color: var(--text-muted); font-size: 15px; margin-bottom: 20px;"></p>
    
    <button class="btn-main" id="retry-wrongs-btn" style="display: none;" onclick="practiceWrongs()">⚠️ Yanlış Yapılanları Tekrarla</button>
    <button class="btn-main" onclick="startPractice()">🔄 20 Soruluk Yeni Pratik</button>
    <button class="btn-secondary" onclick="showLearnArea()">📖 Günleri Tekrar İncele</button>
  </div>

</div>

<script>
  const days = [
    { en: 'Monday', tr: 'Pazartesi', hint: 'Moon Day (Ay günü) - Haftanın ilk günü' },
    { en: 'Tuesday', tr: 'Salı', hint: '"Tues" sesiyle başlar, haftanın 2. günü' },
    { en: 'Wednesday', tr: 'Çarşamba', hint: 'Yazılışı "Wed-nes-day" olsa da "Wenzdey" okunur' },
    { en: 'Thursday', tr: 'Perşembe', hint: 'Thor (Şimşek tanrısı) günü, dili dişlerin arasına alarak "Törzdey"' },
    { en: 'Friday', tr: 'Cuma', hint: 'Hafta sonunun müjdecisi, cuma neşesi' },
    { en: 'Saturday', tr: 'Cumartesi', hint: 'Saturn (Satürn) günü, hafta sonu başlangıcı' },
    { en: 'Sunday', tr: 'Pazar', hint: 'Sun Day (Güneş günü) - Dinlenme günü' }
  ];

  let questions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let answered = false;
  let wrongQuestions = [];

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function renderLearnCards() {
    const container = document.getElementById('learn-cards');
    container.innerHTML = '';
    days.forEach(d => {
      const card = document.createElement('div');
      card.className = 'day-card';
      card.onclick = () => speakText(d.en);
      card.innerHTML = `
        <div class="day-left">
          <span class="day-en">${d.en}</span>
          <span class="day-tr">${d.tr}</span>
          <span class="day-hint">${d.hint}</span>
        </div>
        <button class="btn-speaker" aria-label="Dinle">🔊</button>
      `;
      container.appendChild(card);
    });
  }

  function showLearnArea() {
    document.getElementById('learn-area').style.display = 'block';
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'none';
  }

  function generateQuestions(pool, count = 20) {
    const list = [];
    const types = ['en-to-tr', 'tr-to-en', 'listening', 'speaking'];

    for (let i = 0; i < count; i++) {
      const target = pool[Math.floor(Math.random() * pool.length)];
      const qType = types[i % types.length];
      
      const wrongPool = days.filter(d => d.en !== target.en);
      const chosenWrongs = wrongPool.sort(() => Math.random() - 0.5).slice(0, 3);
      const allChoices = [target, ...chosenWrongs].sort(() => Math.random() - 0.5);

      list.push({ type: qType, target, choices: allChoices });
    }
    return list.sort(() => Math.random() - 0.5);
  }

  function startPractice() {
    questions = generateQuestions(days, 20);
    currentIndex = 0;
    correctCount = 0;
    wrongQuestions = [];
    document.getElementById('learn-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('result-area').style.display = 'none';
    renderQuestion();
  }

  function practiceWrongs() {
    questions = generateQuestions(wrongQuestions.map(w => w.target), Math.max(5, wrongQuestions.length));
    currentIndex = 0;
    correctCount = 0;
    wrongQuestions = [];
    document.getElementById('learn-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('result-area').style.display = 'none';
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = questions[currentIndex];
    const total = questions.length;

    document.getElementById('question-index').textContent = `Soru ${currentIndex + 1} / ${total}`;
    document.getElementById('score-counter').textContent = `Doğru: ${correctCount}`;
    document.getElementById('progress-bar').style.width = `${((currentIndex) / total) * 100}%`;
    document.getElementById('feedback-text').innerHTML = '';
    document.getElementById('next-btn').style.display = 'none';

    const prompt = document.getElementById('prompt-text');
    const badge = document.getElementById('type-badge');
    const optsContainer = document.getElementById('options-container');
    const actionPanel = document.getElementById('action-panel');
    const actionBtn = document.getElementById('action-btn');
    const actionHint = document.getElementById('action-hint');

    optsContainer.innerHTML = '';
    actionPanel.style.display = 'none';
    optsContainer.style.display = 'grid';

    if (q.type === 'en-to-tr') {
      badge.textContent = 'İngilizce ➔ Türkçe';
      prompt.textContent = `"${q.target.en}" nedir?`;
      renderOptionButtons(q.choices.map(c => ({ label: c.tr, isCorrect: c.en === q.target.en })));
    } 
    else if (q.type === 'tr-to-en') {
      badge.textContent = 'Türkçe ➔ İngilizce';
      prompt.textContent = `"${q.target.tr}" İngilizce nasıl yazılır?`;
      renderOptionButtons(q.choices.map(c => ({ label: c.en, isCorrect: c.en === q.target.en })));
    } 
    else if (q.type === 'listening') {
      badge.textContent = 'Dinle & Seç';
      prompt.textContent = 'Telaffuz edilen günü seçin';
      actionPanel.style.display = 'flex';
      actionBtn.textContent = '🔊';
      actionBtn.className = 'btn-circle';
      actionHint.textContent = 'Tekrar dinlemek için dokunun';
      actionBtn.onclick = () => speakText(q.target.en);
      speakText(q.target.en);
      renderOptionButtons(q.choices.map(c => ({ label: c.en, isCorrect: c.en === q.target.en })));
    } 
    else if (q.type === 'speaking') {
      badge.textContent = 'Telaffuz Pratiği';
      prompt.textContent = `Mikrofona söyleyin: "${q.target.tr}"`;
      actionPanel.style.display = 'flex';
      optsContainer.style.display = 'none';
      actionBtn.textContent = '🎙️';
      actionBtn.className = 'btn-circle';
      actionHint.textContent = 'Mikrofona basıp İngilizce söyleyin';
      actionBtn.onclick = () => startListening(q.target.en);
    }
  }

  function renderOptionButtons(options) {
    const container = document.getElementById('options-container');
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.textContent = opt.label;
      btn.onclick = () => checkAnswer(opt.isCorrect, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(isCorrect, selectedBtn) {
    if (answered) return;
    answered = true;

    const feedback = document.getElementById('feedback-text');
    const buttons = document.querySelectorAll('.btn-opt');
    const q = questions[currentIndex];

    // Her cevapta doğru telaffuzu dinlet
    speakText(q.target.en);

    if (isCorrect) {
      correctCount++;
      if (selectedBtn) selectedBtn.classList.add('correct');
      feedback.innerHTML = `<span style="color: var(--success);">✓ Harika! ${q.target.en} = ${q.target.tr}</span>`;
    } else {
      wrongQuestions.push(q);
      if (selectedBtn) selectedBtn.classList.add('wrong');
      const correctVal = (q.type === 'en-to-tr') ? q.target.tr : q.target.en;
      buttons.forEach(b => {
        if (b.textContent === correctVal) b.classList.add('correct');
      });
      feedback.innerHTML = `
        <span style="color: var(--error);">✗ Doğrusu: <strong>${q.target.en}</strong> (${q.target.tr})</span>
        <span class="feedback-tip">💡 İpucu: ${q.target.hint}</span>
      `;
    }

    document.getElementById('score-counter').textContent = `Doğru: ${correctCount}`;
    document.getElementById('next-btn').style.display = 'block';
  }

  function startListening(expectedWord) {
    if (answered) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('feedback-text').innerHTML = '<span>Mikrofon bu tarayıcıda desteklenmiyor.</span>';
      checkAnswer(true, null);
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const actionBtn = document.getElementById('action-btn');
    const actionHint = document.getElementById('action-hint');
    actionBtn.classList.add('listening');
    actionHint.textContent = 'Dinleniyor... Şimdi konuşun';

    recognition.onresult = (event) => {
      actionBtn.classList.remove('listening');
      const spoken = event.results[0][0].transcript.trim().toLowerCase();
      const expected = expectedWord.toLowerCase();

      if (spoken.includes(expected)) {
        checkAnswer(true, null);
      } else {
        const feedback = document.getElementById('feedback-text');
        feedback.innerHTML = `<span>Duyulan: "${spoken}"</span>`;
        checkAnswer(false, null);
      }
    };

    recognition.onerror = () => {
      actionBtn.classList.remove('listening');
      actionHint.textContent = 'Ses alınamadı. Lütfen tekrar deneyin.';
    };

    recognition.onend = () => {
      actionBtn.classList.remove('listening');
    };

    recognition.start();
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      renderQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('progress-bar').style.width = '100%';

    const percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById('percent-text').textContent = `%${percent}`;
    document.getElementById('result-summary').textContent = 
      `${questions.length} sorudan ${correctCount} tanesini doğru bildiniz.`;

    const retryBtn = document.getElementById('retry-wrongs-btn');
    if (wrongQuestions.length > 0) {
      retryBtn.style.display = 'block';
      retryBtn.textContent = `⚠️ Yanlış Yapılan ${wrongQuestions.length} Kelimeyi Tekrarla`;
    } else {
      retryBtn.style.display = 'none';
    }
  }

  // İlk açılışta ezber kartlarını hazırla
  renderLearnCards();
</script>

</body>
</html>
