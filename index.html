<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #131f24;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #202f36;
      border: 2px solid #37464f;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .track {
      flex: 1;
      height: 12px;
      background: #37464f;
      border-radius: 10px;
      overflow: hidden;
      margin-right: 14px;
    }
    .fill {
      width: 5%;
      height: 100%;
      background: #58cc02;
      transition: width 0.3s;
    }
    .hearts {
      font-size: 18px;
      font-weight: 800;
      color: #ff4b4b;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tag {
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .remain {
      font-size: 13px;
      color: #afc5ce;
      font-weight: 700;
    }
    .title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .hint-link {
      font-size: 13px;
      color: #afc5ce;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 12px;
      display: inline-block;
    }
    .hint-box {
      display: none;
      background: #18282f;
      border: 1px dashed #4b626e;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      color: #ffc800;
      margin-bottom: 14px;
    }
    .sound-row {
      display: none;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .btn-sound {
      background: #1cb0f6;
      border: none;
      border-bottom: 4px solid #1899d6;
      border-radius: 50%;
      width: 64px;
      height: 64px;
      font-size: 26px;
      color: white;
      cursor: pointer;
    }
    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-opt {
      background: #27373f;
      border: 2px solid #37464f;
      border-bottom: 4px solid #37464f;
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .btn-opt:active { transform: translateY(2px); border-bottom-width: 2px; }
    .btn-opt.sel {
      border-color: #1cb0f6;
      border-bottom-color: #1899d6;
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
    }
    .btn-opt.ok {
      border-color: #58cc02 !important;
      border-bottom-color: #58a700 !important;
      background: rgba(88, 204, 2, 0.2) !important;
      color: #58cc02 !important;
    }
    .btn-opt.err {
      border-color: #ff4b4b !important;
      border-bottom-color: #ea2b2b !important;
      background: rgba(255, 75, 75, 0.2) !important;
      color: #ff4b4b !important;
    }
    .alert {
      display: none;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.4;
    }
    .alert.ok {
      background: rgba(88, 204, 2, 0.15);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .alert.err {
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }
    .btn-main {
      width: 100%;
      background: #58cc02;
      border: none;
      border-bottom: 4px solid #58a700;
      color: white;
      font-size: 17px;
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-main:active { transform: translateY(2px); border-bottom-width: 2px; }
    .btn-main.disabled {
      background: #37464f;
      border-bottom-color: #27333a;
      color: #6a828e;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="top">
    <div class="track"><div class="fill" id="p-bar"></div></div>
    <div class="hearts">❤️ <span id="h-val">5</span></div>
  </div>

  <div id="quiz-ui">
    <div class="meta">
      <span class="tag" id="q-tag">TÜRKÇE ➔ İNGİLİZCE</span>
      <span class="remain" id="q-remain">Kalan: 20</span>
    </div>
