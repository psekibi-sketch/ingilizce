<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - Duolingo Tarzı İngilizce Öğren</title>
  <style>
    :root {
      --bg: #131f24;
      --card: #202f36;
      --accent: #58cc02;
      --accent-shadow: #58a700;
      --blue: #1cb0f6;
      --blue-shadow: #1899d6;
      --red: #ff4b4b;
      --red-shadow: #ea2b2b;
      --yellow: #ffc800;
      --text: #ffffff;
      --text-sub: #afc5ce;
      --border: #37464f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DIN Round Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .app-wrapper {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 28px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 90vh;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Üst Bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px 12px;
    }
    .progress-track {
      flex: 1;
      height: 14px;
      background: #37464f;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 20px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hearts-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 18px;
      color: var(--red);
    }

    /* Ana İçerik */
    .content-area {
      flex: 1;
      padding: 16px 24px 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .exercise-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.25;
      text-align: left;
    }

    /* Mnemonic Görsel Kart */
    .mnemonic-banner {
      background: #18282f;
      border: 2px dashed #4b626e;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .mnemonic-banner:active { transform: scale(0.98); }
    .mnemonic-icon { font-size: 48px; }
    .mnemonic-info { flex: 1; }
    .mnemonic-word { font-size: 22px; font-weight: 800; color: var(--blue); }
    .mnemonic-trick { font-size: 14px; color: var(--text-sub); margin-top: 4px; line-height: 1.3; }

    /* Butonlar & Seçenekler */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .btn-3d {
      background: var(--card);
      border: 2px solid var(--border);
      border-bottom: 5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.1s;
      outline: none;
    }
    .btn-3d:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }
    .btn-3d.selected {
      border-color: var(--blue);
      border-bottom-color: var(--blue-shadow);
      background: rgba(28, 176, 246, 0.15);
      color: var(--blue);
    }
    .btn-3d.correct {
      border-color: var(--accent) !important;
      border-bottom-color: var(--accent-shadow) !important;
      background: rgba(88, 204, 2, 0.2) !important;
      color: var(--accent) !important;
    }
    .btn-3d.wrong {
      border-color: var(--red) !important;
      border-bottom-color: var(--red-shadow) !important;
      background: rgba(255, 75, 75, 0.2) !important;
      color: var(--red) !important;
    }

    /* Harf Dizme (Scramble) */
    .scramble-slots {
      min-height: 54px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 0;
      align-items: center;
    }
    .scramble-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .letter-chip {
      background: #2a3c44;
      border: 2px solid #3d515a;
      border-bottom: 4px solid #3d515a;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
    }
    .letter-chip:active { transform: translateY(2px); border-bottom-width: 2px; }
    .letter-chip.used { opacity: 0.2; pointer-events: none; }

    /* Ses & Konuşma */
    .audio-circle-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
