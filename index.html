<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - 2. Sınıf İngilizce</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 75px;
    }

    /* TOP HEADER */
    header {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 24px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-area h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .title-area p {
      font-size: 11px;
      color: var(--muted);
    }

    .header-widgets {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-badge {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }

    .timer-badge.paused {
      color: var(--warning);
      border-color: var(--warning);
    }

    .sound-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    /* MAIN NAV TABS */
    .nav-scroll {
      max-width: 900px;
      margin: 10px auto 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .nav-tab {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    /* CONTAINER */
    main {
      max-width: 900px;
      width: 100%;
      margin: 16px auto;
      padding: 0 16px;
      flex: 1;
    }

    /* CARD STYLES */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .reset-btn:hover { background: rgba(239, 68, 68, 0.25); }

    /* PAGE CHIPS */
    .page-nav-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .page-chip {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .page-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* WORD GRID */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .word-tile {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .word-tile:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .word-tile .tile-icon { font-size: 28px; margin-bottom: 6px; }
    .word-tile .en-text { font-size: 14px; font-weight: 700; color: #fff; }
    .word-tile .tr-text { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .speaker-icon {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 12px;
      opacity: 0.6;
    }

    /* SENTENCE BUILDER / ORDERING */
    .order-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      background: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 12px;
      margin: 12px 0;
      align-items: center;
    }

    .word-chip {
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .word-chip.pool {
      background: #334155;
      color: #e2e8f0;
    }

    /* QUIZ STYLES */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .quiz-question-box {
      margin: 16px 0;
    }

    .quiz-prompt {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .quiz-word {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background: #0f172a;
      border: 2px solid var(--border);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #1e293b;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: var(--success) !important;
      color: #34d399 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: var(--danger) !important;
      color: #f87171 !important;
    }

    /* FEEDBACK BANNER */
    .feedback-banner {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .feedback-banner.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #34d399;
    }

    .feedback-banner.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #f87171;
    }

    .action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn.retry {
      background: var(--warning);
      color: #0f172a;
    }

    /* FLASHCARD */
    .flashcard-container {
      perspective: 1000px;
      max-width: 320px;
      margin: 20px auto;
      cursor: pointer;
    }

    .flashcard {
      width: 100%;
      height: 200px;
      background: #1e293b;
      border: 2px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s;
    }

    .flashcard:hover {
      border-color: var(--accent);
    }

    /* DAYS SORTING */
    .sortable-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sort-controls {
      display: flex;
      gap: 6px;
    }

    .sort-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }

    .b-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    .b-nav-item.active {
      color: var(--primary);
    }

    .b-nav-item .b-icon {
      font-size: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div class="logo-group">
        <div class="logo-icon">📚</div>
        <div class="title-area">
          <h1>LingoDays 2. Sınıf</h1>
          <p id="subHeaderTitle">İngilizce Öğrenme & Pratik</p>
        </div>
      </div>
      <div class="header-widgets">
        <div class="timer-badge" id="studyTimerBadge" title="10 saniye hareketsiz kalırsanız durur">
          ⏱️ <span id="studyTimerText">00:00</span>
        </div>
        <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()" title="Sesi Aç/Kapat">🔊</button>
      </div>
    </div>

    <!-- MAIN NAV SCROLL -->
    <div class="nav-scroll">
      <button class="nav-tab active" onclick="switchMainTab('unit3')" id="tab_unit3">👤 3. Ünite: Personal Life</button>
      <button class="nav-tab" onclick="switchMainTab('unit2')" id="tab_unit2">🏫 2. Ünite: Classroom Life</button>
      <button class="nav-tab" onclick="switchMainTab('days_sort')" id="tab_days_sort">📅 Gün Sıralama</button>
      <button class="nav-tab" onclick="switchMainTab('quiz')" id="tab_quiz">🎯 Ödev & Test</button>
      <button class="nav-tab" onclick="switchMainTab('flashcards')" id="tab_flashcards">🃏 Kelime Kartları</button>
      <button class="nav-tab" onclick="switchMainTab('guide')" id="tab_guide">📖 Günler Rehberi</button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="appContent"></main>

  <!-- BOTTOM MOBILE NAVIGATION -->
  <nav class="bottom-nav">
    <button class="b-nav-item active" onclick="switchMainTab('unit3')" id="bnav_unit3">
      <span class="b-icon">👤</span>
      <span>3. Ünite</span>
    </button>
    <button class="b-nav-item" onclick="switchMainTab('unit2')" id="bnav_unit2">
      <span class="b-icon">🏫</span>
      <span>2. Ünite</span>
    </button>
    <button class="b-nav-item" onclick="switchMainTab('days_sort')" id="bnav_days_sort">
      <span class="b-icon">📅</span>
      <span>Sıralama</span>
    </button>
    <button class="b-nav-item" onclick="switchMainTab('quiz')" id="bnav_quiz">
      <span class="b-icon">🎯</span>
      <span>Test</span>
    </button>
    <button class="b-nav-item" onclick="switchMainTab('flashcards')" id="bnav_flashcards">
      <span class="b-icon">🃏</span>
      <span>Kartlar</span>
    </button>
  </nav>

  <script>
    /* ========================================================
       1. GLOBAL STATE & SOUND & INACTIVITY TIMER
    ======================================================== */
    let currentMainTab = 'unit3';
    let currentUnit3Page = 25;
    let currentUnit2Page = 18;
    let soundEnabled = true;

    // Çalışma Sayacı (10 saniye hareketsizlik algılayıcılı)
    let totalSeconds = 0;
    let idleSeconds = 0;
    let isPaused = false;

    setInterval(() => {
      idleSeconds++;
      if (idleSeconds >= 10) {
        isPaused = true;
        document.getElementById('studyTimerBadge').classList.add('paused');
      } else {
        isPaused = false;
        document.getElementById('studyTimerBadge').classList.remove('paused');
        totalSeconds++;
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('studyTimerText').textContent = `${mins}:${secs}`;
      }
    }, 1000);

    function recordActivity() {
      idleSeconds = 0;
      if (isPaused) {
        isPaused = false;
        document.getElementById('studyTimerBadge').classList.remove('paused');
      }
    }
    ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
      window.addEventListener(evt, recordActivity, { passive: true });
    });

    // Ses Telaffuzu (Web Speech API)
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    function speakText(text) {
      recordActivity();
      if (!soundEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    /* ========================================================
       2. TAB NAVIGATION
    ======================================================== */
    function switchMainTab(tabId) {
      recordActivity();
      currentMainTab = tabId;

      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      const activeNavTab = document.getElementById(`tab_${tabId}`);
      if (activeNavTab) activeNavTab.classList.add('active');

      document.querySelectorAll('.b-nav-item').forEach(b => b.classList.remove('active'));
      const activeBNav = document.getElementById(`bnav_${tabId}`);
      if (activeBNav) activeBNav.classList.add('active');

      if (tabId === 'unit3') {
        document.getElementById('subHeaderTitle').textContent = `3. Ünite: Personal Life (Sayfa ${currentUnit3Page})`;
        renderUnit3();
      } else if (tabId === 'unit2') {
        document.getElementById('subHeaderTitle').textContent = `2. Ünite: Classroom Life (Sayfa ${currentUnit2Page})`;
        renderUnit2();
      } else if (tabId === 'days_sort') {
        document.getElementById('subHeaderTitle').textContent = 'Haftanın Günleri Sıralama Ödevi';
        renderDaysSort();
      } else if (tabId === 'quiz') {
        document.getElementById('subHeaderTitle').textContent = 'Ödev & Test Modu (Can Yok / Tekrar Haklı)';
        renderQuiz();
      } else if (tabId === 'flashcards') {
        document.getElementById('subHeaderTitle').textContent = 'Kelimeler & Flaş Kartlar';
        renderFlashcards();
      } else if (tabId === 'guide') {
        document.getElementById('subHeaderTitle').textContent = 'Günler ve Telaffuz Rehberi';
        renderDaysGuide();
      }
    }

    /* ========================================================
       3. UNIT 3: PERSONAL LIFE (SAYFA 25 - 32)
    ======================================================== */
    const u3BodyParts = [
      { en: "Head", tr: "Baş / Kafa", icon: "👤" },
      { en: "Eye", tr: "Göz", icon: "👁️" },
      { en: "Nose", tr: "Burun", icon: "👃" },
      { en: "Mouth", tr: "Ağız", icon: "👄" },
      { en: "Ear", tr: "Kulak", icon: "👂" },
      { en: "Hair", tr: "Saç", icon: "💇" },
      { en: "Arm", tr: "Kol", icon: "💪" },
      { en: "Hand", tr: "El", icon: "✋" },
      { en: "Leg", tr: "Bacak", icon: "🦵" },
      { en: "Body", tr: "Vücut", icon: "🧍" }
    ];

    const u3Clothes = [
      { en: "Glasses", tr: "Gözlük", icon: "👓" },
      { en: "Coat", tr: "Palto / Kaban", icon: "🧥" },
      { en: "Shirt", tr: "Gömlek", icon: "👔" },
      { en: "Scarf", tr: "Atkı", icon: "🧣" },
      { en: "Shoes", tr: "Ayakkabı", icon: "👞" },
      { en: "Trousers", tr: "Pantolon", icon: "👖" },
      { en: "T-shirt", tr: "Tişört", icon: "👕" },
      { en: "Dress", tr: "Elbise", icon: "👗" },
      { en: "Hat", tr: "Şapka", icon: "🧢" }
    ];

    let page28Selected = [];
    const page28CorrectWords = ["This", "is", "my", "hat"];

    function renderUnit3() {
      let pageNavHtml = `
        <div class="page-nav-bar">
          ${[25, 26, 27, 28, 29, 30, 31, 32].map(p => `
            <button class="page-chip ${currentUnit3Page === p ? 'active' : ''}" onclick="selectUnit3Page(${p})">
              Sayfa ${p}
            </button>
          `).join('')}
        </div>
      `;

      let contentHtml = '';

      if (currentUnit3Page === 25) {
        contentHtml = `
          <div class="card">
            <div class="card-header-bar">
              <div class="card-title">📖 Sayfa 25: Theme 3 - Personal Life Giriş</div>
              <button class="reset-btn" onclick="renderUnit3()">🔄 Dersi Sıfırla</button>
            </div>
            <p style="color:var(--muted);font-size:13px;margin-bottom:12px;">Vücudumuzun bölümlerini öğrenelim. Hoparlöre veya karta dokunarak sesli dinleyin.</p>
            <div class="word-grid">
              ${u3BodyParts.map(item => `
                <div class="word-tile" onclick="speakText('${item.en}')">
                  <span class="speaker-icon">🔊</span>
                  <div class="tile-icon">${item.icon}</div>
                  <div class="en-text">${item.en}</div>
                  <div class="tr-text">${item.tr}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentUnit3Page === 26) {
        contentHtml = `
          <div class="card">
            <div class="card-header-bar">
              <div class="card-title">👂 Sayfa 26: Listen and Point (Dinle ve Göster)</div>
              <button class="reset-btn" onclick="resetPage26()">🔄 Dersi Sıfırla</button>
            </div>
            <p style="color:var(--muted);font-size:13px;">Soruyu dinleyin ve doğru vücut bölümüne dokunun.</p>
            <div style="text-align:center;margin:16px 0;">
              <button class="action-btn" onclick="speakText('Touch your nose')">🔊 "Touch your nose" Dinle</button>
            </div>
            <div id="page26Feedback"></div>
            <div class="word-grid">
              ${[
                { en: "Eye", tr: "Göz", icon: "👁️" },
                { en: "Nose", tr: "Burun", icon: "👃", correct: true },
                { en: "Mouth", tr: "Ağız", icon: "👄" },
                { en: "Ear", tr: "Kulak", icon: "👂" }
              ].map(opt => `
                <div class="word-tile" onclick="checkPage26(${!!opt.correct}, '${opt.en}')">
                  <div class="tile-icon">${opt.icon}</div>
                  <div class="en-text">${opt.en}</div>
                  <div class="tr-text">${opt.tr}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentUnit3Page === 27) {
        contentHtml = `
          <div class="card">
            <div class="card-header-bar">
              <div class="card-title">👗 Sayfa 27: Clothes & Accessories (Giysiler)</div>
              <button class="reset-btn" onclick="renderUnit3()">🔄 Dersi Sıfırla</button>
            </div>
            <p style="color:var(--muted);font-size:13px;margin-bottom:12px;">Giysi ve aksesuarlarımızın İngilizcelerini öğrenelim. Dinlemek için dokunun.</p>
            <div class="word-grid">
              ${u3Clothes.map(item => `
                <div class="word-tile" onclick="speakText('${item.en}')">
                  <span class="speaker-icon">🔊</span>
                  <div class="tile-icon">${item.icon}</div>
                  <div class="en-text">${item.en}</div>
                  <div class="tr-text">${item.tr}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

      const tmp = userDaysOrder[idx];

      renderDaysSort();
    }

      if (idx >= userDaysOrder.length - 1) return;
      const tmp = userDaysOrder[idx];
      userDaysOrder[idx] = userDaysOrder[idx + 1];

      renderDaysSort();

        if (userDaysOrder[i].en !== correctDaysOrder[i].en) {
          isAllCorrect = false;
          wrongCount++;
        }
      }

      const fb = document.getElementById('daysSortFeedback');
      if (isAllCorrect) {
        speakText('Excellent! Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Perfect order!');
        fb.innerHTML = `<div class="feedback-banner success"><span>🎉 TEBRİKLER! Tüm günler tam sırasında: Monday ... Sunday!</span></div>`;
      } else {
        speakText('Some days are not in the right order. Try again.');
        fb.innerHTML = `<div class="feedback-banner error"><span>❌ Sıralamada ${wrongCount} gün yanlış yerde! Okları kullanarak düzeltin.</span></div>`;
      }
    }

    /* ========================================================
       6. QUIZ / TEST MODU (CAN YOK, YANLIŞTA TEKRAR DENETİR)
    ======================================================== */
    const quizQuestions = [
      { prompt: "Aşağıdakilerden hangisi 'BURUN' demektir?", word: "Burun", correct: "Nose", options: ["Eye", "Nose", "Ear", "Head"] },
      { prompt: "'PENCIL' kelimesinin Türkçe karşılığı nedir?", word: "Pencil", correct: "Kurşun Kalem", options: ["Silgi", "Kitap", "Kurşun Kalem", "Cetvel"] },
      { prompt: "Haftanın ilk günü hangisidir?", word: "Pazartesi", correct: "Monday", options: ["Sunday", "Friday", "Monday", "Tuesday"] },
      { prompt: "'SHOES' kelimesinin Türkçe anlamı nedir?", word: "Shoes", correct: "Ayakkabı", options: ["Ayakkabı", "Gözlük", "Şapka", "Pantolon"] },
      { prompt: "'STAND UP' komutu ne anlama gelir?", word: "Stand up", correct: "Ayağa kalk", options: ["Otur", "Ayağa kalk", "Kitabı aç", "Sessiz ol"] },
      { prompt: "'EYE' kelimesi ne anlama gelir?", word: "Eye", correct: "Göz", options: ["Burun", "Ağız", "Göz", "Kulak"] },
      { prompt: "'FRIDAY' hangi gündür?", word: "Friday", correct: "Cuma", options: ["Perşembe", "Cuma", "Cumartesi", "Pazar"] },
      { prompt: "'HAT' kelimesi ne anlama gelir?", word: "Hat", correct: "Şapka", options: ["Elbise", "Şapka", "Atkı", "Gömlek"] },
      { prompt: "'RULER' kelimesi nedir?", word: "Ruler", correct: "Cetvel", options: ["Cetvel", "Silgi", "Kalem", "Çanta"] },
      { prompt: "'SUNDAY' hangi gündür?", word: "Sunday", correct: "Pazar", options: ["Cumartesi", "Pazar", "Salı", "Çarşamba"] }
    ];

    let currentQuizIndex = 0;
    let quizSelectedAnswer = null;
    let quizState = 'pending';

    function renderQuiz() {
      if (currentQuizIndex >= quizQuestions.length) {
        document.getElementById('appContent').innerHTML = `
          <div class="quiz-card">
            <div style="font-size:54px;margin-bottom:12px;">🏆 🌟 🎉</div>
            <h2 style="font-size:22px;color:#34d399;margin-bottom:10px;">Testi Başarıyla Tamamladınız!</h2>
            <p style="font-size:14px;color:var(--muted);margin-bottom:20px;">
              Tüm 10 soruyu doğru cevaplayana kadar pratik yaptınız. Harika bir çalışma!
            </p>
            <button class="action-btn" onclick="restartQuiz()">Testi Tekrar Başlat 🔄</button>
          </div>
        `;
        return;
      }

      const q = quizQuestions[currentQuizIndex];

      const html = `
        <div class="quiz-card">
          <div class="card-header-bar" style="border:none;margin-bottom:0;">
            <div style="font-size:13px;font-weight:700;color:var(--accent);">
              Soru ${currentQuizIndex + 1} / ${quizQuestions.length}
            </div>
            <button class="reset-btn" onclick="restartQuiz()">🔄 Testi Sıfırla</button>
          </div>

          <div class="quiz-question-box">
            <div class="quiz-prompt">${q.prompt}</div>
            <div class="quiz-word" onclick="speakText('${q.correct}')">
              ${q.word} <span>🔊</span>
            </div>
          </div>

          <!-- YAZILI ŞIKLAR (Emoji ipucu yok, ezberletir) -->
          <div class="options-grid">
            ${q.options.map(opt => {
              let btnClass = 'option-btn';
              if (quizState === 'correct' && opt === q.correct) btnClass += ' correct';
              if (quizState === 'wrong' && opt === quizSelectedAnswer) btnClass += ' wrong';
              return `
                <button class="${btnClass}" onclick="handleQuizAnswer('${opt}')" ${quizState === 'correct' ? 'disabled' : ''}>
                  ${opt}
                </button>
              `;
            }).join('')}
          </div>

          <div id="quizFeedbackArea">
            ${quizState === 'correct' ? `
              <div class="feedback-banner success">
                <span>🎉 Harika! Doğru cevap!</span>
                <button class="action-btn" onclick="nextQuizQuestion()">Sonraki Soru ➔</button>
              </div>
            ` : ''}

            ${quizState === 'wrong' ? `
              <div class="feedback-banner error">
                <span>❌ Yanlış cevap! Çocuğun kendisi bulana kadar tekrar deneyin.</span>
                <button class="action-btn retry" onclick="retryQuizQuestion()">Tekrar Dene 🔄</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;

      document.getElementById('appContent').innerHTML = html;
    }

    function handleQuizAnswer(opt) {
      quizSelectedAnswer = opt;
      const q = quizQuestions[currentQuizIndex];
      if (opt === q.correct) {
        quizState = 'correct';
        speakText('Excellent! Correct!');
      } else {
        quizState = 'wrong';
        speakText('Try again');
      }
      renderQuiz();
    }

    function retryQuizQuestion() {
      quizState = 'pending';
      quizSelectedAnswer = null;
      renderQuiz();
    }

    function nextQuizQuestion() {
      currentQuizIndex++;
      quizState = 'pending';
      quizSelectedAnswer = null;
      renderQuiz();
    }

    function restartQuiz() {
      currentQuizIndex = 0;
      quizState = 'pending';
      quizSelectedAnswer = null;
      renderQuiz();
    }

    /* ========================================================
       7. FLASHCARDS (FLAŞ KARTLAR)
    ======================================================== */
    const allFlashcards = [
      ...u3BodyParts,
      ...u3Clothes,
      ...u2Objects,
      ...correctDaysOrder
    ];

    let flashcardIndex = 0;
    let flashcardFlipped = false;

    function renderFlashcards() {
      const card = allFlashcards[flashcardIndex];

      const html = `
        <div class="card" style="text-align:center;">
          <div class="card-header-bar">
            <div class="card-title">🃏 Kelime Kartları (${flashcardIndex + 1} / ${allFlashcards.length})</div>
            <button class="reset-btn" onclick="flashcardIndex=0;flashcardFlipped=false;renderFlashcards();">🔄 Başa Dön</button>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Karta tıklayarak Türkçesini görün veya arkasını çevirin.</p>

          <div class="flashcard-container" onclick="flipFlashcard()">
            <div class="flashcard">
              <div style="font-size:48px;margin-bottom:8px;">${card.icon || '📖'}</div>
              <h2 style="font-size:24px;color:#38bdf8;">${flashcardFlipped ? card.tr : card.en}</h2>
              <p style="font-size:12px;color:var(--muted);margin-top:6px;">
                ${flashcardFlipped ? 'İngilizcesi: ' + card.en : 'Dokununca Türkçesini gösterir'}
              </p>
            </div>
          </div>

          <div style="display:flex;justify-content:center;gap:12px;margin-top:14px;">
            <button class="sort-btn" style="width:44px;height:44px;" onclick="prevFlashcard()">◀</button>
            <button class="action-btn" onclick="speakText('${card.en}')">🔊 Seslendir</button>
            <button class="sort-btn" style="width:44px;height:44px;" onclick="nextFlashcard()">▶</button>
          </div>
        </div>
      `;

      document.getElementById('appContent').innerHTML = html;
    }

    function flipFlashcard() {
      flashcardFlipped = !flashcardFlipped;
      renderFlashcards();
    }

    function nextFlashcard() {
      flashcardIndex = (flashcardIndex + 1) % allFlashcards.length;
      flashcardFlipped = false;
      renderFlashcards();
    }

    function prevFlashcard() {
      flashcardIndex = (flashcardIndex - 1 + allFlashcards.length) % allFlashcards.length;
      flashcardFlipped = false;
      renderFlashcards();
    }

    /* ========================================================
       8. DAYS GUIDE (GÜNLER REHBERİ)
    ======================================================== */
    function renderDaysGuide() {
      const html = `
        <div class="card">
          <div class="card-header-bar">
            <div class="card-title">📖 Haftanın Günleri Telaffuz & Bilgi Rehberi</div>
            <button class="reset-btn" onclick="renderDaysGuide()">🔄 Yenile</button>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Her güne tıklayarak doğru telaffuzunu dinleyebilirsiniz.</p>
          <div class="word-grid">
            ${correctDaysOrder.map((d, idx) => `
              <div class="word-tile" onclick="speakText('${d.en}')">
                <span class="speaker-icon">🔊</span>
                <div class="tile-icon">📅</div>
                <div class="en-text">${idx + 1}. ${d.en}</div>
                <div class="tr-text">${d.tr}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('appContent').innerHTML = html;
    }

    // Başlangıçta 3. Üniteyi yükle
    switchMainTab('unit3');
  </script>
</body>
</html>
