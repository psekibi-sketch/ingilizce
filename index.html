<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #131f24;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #202f36;
      border: 2px solid #37464f;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .track {
      flex: 1;
      height: 12px;
      background: #37464f;
      border-radius: 10px;
      overflow: hidden;
      margin-right: 14px;
    }
    .fill {
      width: 5%;
      height: 100%;
      background: #58cc02;
      transition: width 0.3s;
    }
    .hearts {
      font-size: 18px;
      font-weight: 800;
      color: #ff4b4b;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .tag {
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .queue-info {
      font-size: 13px;
      color: #afc5ce;
      font-weight: 700;
    }
    .title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .hint-trigger {
      display: inline-block;
      font-size: 13px;
      color: #afc5ce;
      cursor: pointer;
      margin-bottom: 12px;
      text-decoration: underline;
    }
    .hint-box {
      background: #18282f;
      border: 1px dashed #4b626e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      color: #ffc800;
      display: none;
    }
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .opt {
      background: #27373f;
      border: 2px solid #37464f;
      border-bottom: 4px solid #37464f;
      border-radius: 14px;
      padding: 15px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .opt:active { transform: translateY(2px); border-bottom-width: 2px; }
    .opt.sel {
      border-color: #1cb0f6;
      border-bottom-color: #1899d6;
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
    }
    .opt.correct-mark {
      border-color: #58cc02 !important;
      border-bottom-color: #58a700 !important;
      background: rgba(88, 204, 2, 0.2) !important;
      color: #58cc02 !important;
    }
    .opt.wrong-mark {
      border-color: #ff4b4b !important;
      border-bottom-color: #ea2b2b !important;
      background: rgba(255, 75, 75, 0.2) !important;
      color: #ff4b4b !important;
    }
    .sound-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .sound-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1cb0f6;
      border: none;
      border-bottom: 4px solid #1899d6;
      font-size: 30px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sound-btn:active { transform: translateY(2px); }
    .sound-btn.listening {
      background: #ff4b4b;
      border-bottom-color: #ea2b2b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .feedback {
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .feedback.ok {
      background: rgba(88, 204, 2, 0.15);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .feedback.err {
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }
    .main-btn {
      width: 100%;
      background: #58cc02;
      border: none;
      border-bottom: 4px solid #58a700;
      color: white;
      font-size: 17px;
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .main-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .main-btn.disabled {
      background: #37464f;
      border-bottom-color: #27333a;
      color: #6a828e;
      pointer-events: none;
    }

    /* İstatistik Grafikleri */
    .stat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
      text-align: left;
    }
    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }
    .stat-bar-bg {
      height: 8px;
      background: #18282f;
      border-radius: 6px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 6px;
    }
    .weakness-alert {
      background: rgba(255, 200, 0, 0.15);
      border: 1px solid #ffc800;
      color: #ffc800;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="top">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="hearts">❤️ <span id="hearts">5</span></div>
  </div>

  <div id="content">
    <div class="info-row">
      <span class="tag" id="tag">Soru</span>
      <span class="queue-info" id="queue-count">Kalan: 20</span>
    </div>
    <div class="title" id="title">Yükleniyor...</div>
    <div class="hint-trigger" id="hint-toggle" onclick="toggleHint()">💡 İpucu ister misin?</div>
    <div class="hint-box" id="hint-box"></div>
    <div id="body-area"></div>
  </div>

  <div class="feedback" id="fb"></div>
  <button class="main-btn disabled" id="action-btn" onclick="handleClick()">KONTROL ET</button>
</div>
