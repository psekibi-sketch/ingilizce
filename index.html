<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #111b21;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      user-select: none;
    }
    .panel {
      background: #1e2c34;
      border: 2px solid #33444f;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
    }
    .ust-serit {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .tur-etiketi {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .sayac-can {
      display: flex;
      gap: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .soru-yazisi {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .ipucu-tusu {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 12px;
    }
    .ipucu-kutusu {
      display: none;
      background: #152229;
      border: 1px dashed #475569;
      color: #facc15;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .ses-kutusu {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .buyuk-yuvarlak-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #38bdf8;
      border: none;
      color: #0b1e11;
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .buyuk-yuvarlak-btn:active { transform: scale(0.95); }
    .buyuk-yuvarlak-btn.dinliyor {
      background: #ef4444;
      animation: pulse 1s infinite;
      color: white;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .liste {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .secenek-butonu {
      background: #273740;
      border: 2px solid #3b4e5a;
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }
