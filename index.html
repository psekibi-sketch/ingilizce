<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      background: #111b21;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .kart {
      background: #1e2c34;
      border: 2px solid #33444f;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .ust-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .etiket {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 8px;
    }
    .sayac {
      display: flex;
      gap: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .soru-satiri {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .soru-baslik {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.3;
      flex: 1;
    }
    .ses-btn {
      background: #38bdf8;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ses-btn:active { transform: scale(0.92); }
    .ipucu-link {
      color: #94a3b8;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 14px;
    }
    .ipucu-kutu {
      display: none;
      background: #152229;
      border: 1px dashed #475569;
      color: #facc15;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .secenekler-kutusu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .secenek-btn {
      background: #273740;
      border: 2px solid #3b4e5a;
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .secenek-btn:active { transform: translateY(1px); }
    .secenek-btn.dogru {
      border-color: #22c55e !important;
      background: #143521 !important;
      color: #22c55e !important;
    }
    .secenek-btn.yanlis {
      border-color: #ef4444 !important;
      background: #3b1818 !important;
      color: #ef4444 !important;
    }
    
    /* Mikrofon Alanı */
    .mikrofon-alani {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }
    .mic-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #38bdf8;
      border: none;
      font-size: 32px;
      color: #0b1e11;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
    }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.dinliyor {
      background: #ef4444;
      color: white;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .mic-durum {
      font-size: 14px;
      color: #94a3b8;
      font-weight: bold;
      min-height: 20px;
    }
    .mic-atla-btn {
      background: transparent;
      border: 1px solid #3b4e5a;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .mesaj-kutusu {
      display: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .mesaj-kutusu.d-ok {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }
    .mesaj-kutusu.d-err {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .ana-btn {
      display: none;
      width: 100%;
      background: #22c55e;
      border: none;
      color: #0b1e11;
      font-size: 16px;
      font-weight: bold;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Özet / Karne Stilleri */
    .ozet-kutu {
      text-align: center;
      padding: 10px 0;
    }
    .skor-daire {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #22c55e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 16px auto;
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }
    .skor-etiket { font-size: 11px; color: #94a3b8; }
    .ozet-satir {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #152229;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="kart" id="ana-kart">
  <div class="ust-bar">
    <span class="etiket" id="tur-etiket">TÜRKÇE ➔ İNGİLİZCE</span>
    <div class="sayac">
      <span id="kalan-sayi" style="color: #4ade80;">Kalan: 20</span>
      <span id="can-sayi" style="color: #ef4444;">❤️ 5</span>
    </div>
  </div>

  <div class="soru-satiri">
    <div class="soru-baslik" id="soru-basligi">"Pazartesi" hangisidir?</div>
    <button class="ses-btn" type="button" onclick="sesCal()">🔊</button>
  </div>
  
  <span class="ipucu-link" onclick="ipucuToggle()">💡 İpucu ister misin?</span>
  <div class="ipucu-kutu" id="ipucu-kutu">Moon-day (Ay günü) - 1. gün</div>

  <!-- Normal 4 Seçenek -->
  <div class="secenekler-kutusu" id="secenekler-kutusu">
    <button class="secenek-btn" id="btn-0" type="button" onclick="cevap(0)">Monday</button>
    <button class="secenek-btn" id="btn-1" type="button" onclick="cevap(1)">Tuesday</button>
    <button class="secenek-btn" id="btn-2" type="button" onclick="cevap(2)">Friday</button>
    <button class="secenek-btn" id="btn-3" type="button" onclick="cevap(3)">Sunday</button>
  </div>

  <!-- Konuşma / Mikrofon Alanı -->
  <div class="mikrofon-alani" id="mikrofon-kutusu">
    <button class="mic-btn" id="mic-btn" type="button" onclick="mikrofonDinle()">🎙️</button>
    <div class="mic-durum" id="mic-durum">Mikrofona dokunun ve söyleyin</div>
    <button class="mic-atla-btn" type="button" onclick="siklaraDon()">Şıklarla Yanıtla ➔</button>
  </div>

  <div class="mesaj-kutusu" id="mesaj-kutu"></div>
  <button class="ana-btn" id="devam-btn" type="button" onclick="sonrakiSoru()">SONRAKİ SORU ➔</button>
</div>

<script>
  var gunler = [
    { en: 'Monday', tr: 'Pazartesi', hint: 'Moon-day (Ay günü) - 1. gün' },
    { en: 'Tuesday', tr: 'Salı', hint: 'Two-sday (2. gün) - Salı' },
    { en: 'Wednesday', tr: 'Çarşamba', hint: 'Wed-nes-day - Ortadaki en uzun gün' },
    { en: 'Thursday', tr: 'Perşembe', hint: 'Thor-sday (Şimşek günü) - Cuma öncesi' },
    { en: 'Friday', tr: 'Cuma', hint: 'Fri-day (Fries) - Hafta sonu kapısı' },
    { en: 'Saturday', tr: 'Cumartesi', hint: 'Saturn-day - Hafta sonu' },
    { en: 'Sunday', tr: 'Pazar', hint: 'Sun-day (Güneş günü) - Dinlenme günü' }
  ];

  function karistir(arr) {
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = copy[i]; copy[i] = copy[j]; copy[j] = t;
    }
    return copy;
  }

  function soruOlustur(hedef, tip) {
    var yanlislar = gunler.filter(function(g) { return g.en !== hedef.en; });
    yanlislar = karistir(yanlislar).slice(0, 3);
    var secenekler = karistir([hedef].concat(yanlislar));
    return { 
      hedef: hedef, 
      tip: tip, 
      secenekler: secenekler,
      hataYapti: false // İstatistik takibi için
    };
  }

  // 20 Soru: TR->EN, EN->TR ve Konuşma modları dengeli dağıtıldı
  var kuyruk = [];
  var modlar = ['tr_en', 'en_tr', 'konus', 'tr_en', 'en_tr'];
  for (var i = 0; i < 20; i++) {
    var g = gunler[i % gunler.length];
    var t = modlar[i % modlar.length];
    kuyruk.push(soruOlustur(g, t));
  }
  kuyruk = karistir(kuyruk);

  var can = 5;
  var kilitli = false;

  // İstatistik Sayaçları
  var toplamBaslangicSorusu = 20;
  var ilkDenemedeDogru = 0;
  var sonradanOgrenilen = 0;
  var toplamHata = 0;

  function seslendir(metin, dil) {
    try {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(metin);
        u.lang = dil || 'en-US';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    } catch(e) {}
  }

  // HOPARLÖR TUŞU (Kopya vermez!)
  window.sesCal = function() {
    if (kuyruk.length === 0) return;
    var aktif = kuyruk[0];
    
    // Türkçe sorularda veya telaffuz sorusunda soru Türkçe seslendirilir (kopya engellendi)
    if (aktif.tip === 'tr_en' || aktif.tip === 'konus') {
      seslendir(aktif.hedef.tr, 'tr-TR');
    } else {
      // İngilizce soruda zaten ekranda "Monday" yazdığı için İngilizce seslendirir
      seslendir(aktif.hedef.en, 'en-US');
    }
  };

  window.ipucuToggle = function() {
    var el = document.getElementById('ipucu-kutu');
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  };

  window.soruGoster = function() {
    kilitli = false;
    document.getElementById('mesaj-kutu').style.display = 'none';
    document.getElementById('devam-btn').style.display = 'none';
    document.getElementById('ipucu-kutu').style.display = 'none';

    var aktif = kuyruk[0];
    document.getElementById('kalan-sayi').textContent = 'Kalan: ' + kuyruk.length;
    document.getElementById('can-sayi').textContent = '❤️ ' + can;
    document.getElementById('ipucu-kutu').textContent = '💡 İpucu: ' + aktif.hedef.hint;

    var seceneklerKutusu = document.getElementById('secenekler-kutusu');
    var mikrofonKutusu = document.getElementById('mikrofon-kutusu');

    if (aktif.tip === 'konus') {
      // KONUŞMA MODU
      document.getElementById('tur-etiket').textContent = 'TELAFFUZ / KONUŞMA 🎙️';
      document.getElementById('soru-basligi').textContent = '"' + aktif.hedef.tr + '" gününü İngilizce söyle:';
      
      seceneklerKutusu.style.display = 'none';
      mikrofonKutusu.style.display = 'flex';
      document.getElementById('mic-durum').textContent = 'Mikrofona dokunun ve söyleyin';
      document.getElementById('mic-btn').className = 'mic-btn';
    } else {
      // TEST MODU
      mikrofonKutusu.style.display = 'none';
      seceneklerKutusu.style.display = 'flex';

      if (aktif.tip === 'tr_en') {
        document.getElementById('tur-etiket').textContent = 'TÜRKÇE ➔ İNGİLİZCE';
        document.getElementById('soru-basligi').textContent = '"' + aktif.hedef.tr + '" hangisidir?';
      } else {
        document.getElementById('tur-etiket').textContent = 'İNGİLİZCE ➔ TÜRKÇE';
        document.getElementById('soru-basligi').textContent = '"' + aktif.hedef.en + '" ne demektir?';
      }

      for (var i = 0; i < 4; i++) {
        var btn = document.getElementById('btn-' + i);
        btn.className = 'secenek-btn';
        btn.textContent = (aktif.tip === 'tr_en') ? aktif.secenekler[i].en : aktif.secenekler[i].tr;
      }
    }
  };

  // Mikrofon Desteklemezse veya İzin Verilmezse Şıklara Dönme Butonu
  window.siklaraDon = function() {
    if (kuyruk.length > 0) {
      kuyruk[0].tip = 'tr_en';
      window.soruGoster();
    }
  };

  // MİKROFON DİNLEME
  window.mikrofonDinle = function() {
    if (kilitli) return;
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    var micBtn = document.getElementById('mic-btn');
    var durum = document.getElementById
