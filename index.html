<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İngilizce Günler</title>
  <style>
    body {
      background-color: #121f24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .kutu {
      background-color: #1f2e35;
      border: 2px solid #37464f;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
    }
    .ust-bilgi {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #58cc02;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .can {
      color: #ff4b4b;
    }
    .soru-baslik {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 25px;
    }
    .ipucu-alani {
      font-size: 13px;
      color: #ffc800;
      background: #18252a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .ipucu-btn {
      color: #afc5ce;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 15px;
    }
    .ses-kutusu {
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }
    .ses-butonu {
      background: #1cb0f6;
      border: none;
      color: white;
      font-size: 28px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
    }
    .secenekler {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }
    .secenek {
      background-color: #2b3940;
      color: #ffffff;
      border: 2px solid #37464f;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }
    .secenek.secildi {
      border-color: #1cb0f6;
      background-color: #1a3847;
    }
    .secenek.dogru {
      border-color: #58cc02 !important;
      background-color: #1e3b22 !important;
      color: #58cc02 !important;
    }
    .secenek.yanlis {
      border-color: #ff4b4b !important;
      background-color: #401e1e !important;
      color: #ff4b4b !important;
    }
    .mesaj-alani {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }
    .mesaj-alani.dogru {
      background: rgba(88, 204, 2, 0.2);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .mesaj-alani.yanlis {
      background: rgba(255, 75, 75, 0.2);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }
    .ana-buton {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background-color: #58cc02;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    .ana-buton:disabled {
      background-color: #37464f;
      color: #6a828e;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="kutu">
  <div class="ust-bilgi">
    <span id="kalan-sayisi">Kalan Soru: 20</span>
    <span class="can" id="can-sayisi">❤️ 5</span>
  </div>

  <div id="oyun-alani">
    <div class="soru-baslik" id="soru-metni">"Pazartesi" hangisidir?</div>
    
    <span class="ipucu-btn" onclick="ipucuGoster()">💡 İpucu ister misin?</span>
    <div class="ipucu-alani" id="ipucu-metni">Moon-day (Ay günü) - 1. gün</div>

    <div class="ses-kutusu" id="ses-alani">
      <button class="ses-butonu" type="button" onclick="sesCal()">🔊</button>
      <div style="font-size:12px; color:#afc5ce; margin-top:5px;">Dinlemek için dokunun</div>
    </div>

    <div class="secenekler">
      <button class="secenek" type="button" onclick="secimYap(0)" id="btn-0">Monday</button>
      <button class="secenek" type="button" onclick="secimYap(1)" id="btn-1">Tuesday</button>
      <button class="secenek" type="button" onclick="secimYap(2)" id="btn-2">Friday</button>
      <button class="secenek" type="button" onclick="secimYap(3)" id="btn-3">Sunday</button>
    </div>
  </div>

  <div id="sonuc-alani" style="display:none; text-align:center;">
    <div style="font-size:40px; margin-bottom:10px;">🏆</div>
    <div style="font-size:20px; font-weight:bold; margin-bottom:10px;">Tebrikler!</div>
    <div style="color:#afc5ce; margin-bottom:20px;">Tüm günleri başarıyla tamamladınız.</div>
  </div>

  <div class="mesaj-alani" id="bildirim"></div>
  <button class="ana-buton" id="kontrol-butonu" disabled onclick="butonaBasildi()">KONTROL ET</button>
</div>

<script>
  var gunler = [
    { en: 'Monday', tr: 'Pazartesi', hint: 'Moon-day (Ay günü) - Haftanın 1. günü' },
    { en: 'Tuesday', tr: 'Salı', hint: 'Two-sday (2. gün) - İkinci gün' },
    { en: 'Wednesday', tr: 'Çarşamba', hint: 'Wed-nes-day - Ortadaki en uzun gün' },
    { en: 'Thursday', tr: 'Perşembe', hint: 'Thor-sday (Şimşek günü) - Cuma öncesi' },
    { en: 'Friday', tr: 'Cuma', hint: 'Fri-day (Fries) - Hafta sonu kapısı' },
    { en: 'Saturday', tr: 'Cumartesi', hint: 'Saturn-day - Hafta sonu başlangıcı' },
    { en: 'Sunday', tr: 'Pazar', hint: 'Sun-day (Güneş günü) - Dinlenme günü' }
  ];

  var kuyruk = [
    { hedef: gunler[0], tip: 'tr_en', siklar: [gunler[0], gunler[1], gunler[4], gunler[6]] },
    { hedef: gunler[1], tip: 'en_tr', siklar: [gunler[0], gunler[1], gunler[2], gunler[3]] },
    { hedef: gunler[4], tip: 'ses', siklar: [gunler[3], gunler[4], gunler[5], gunler[6]] },
    { hedef: gunler[2], tip: 'tr_en', siklar: [gunler[1], gunler[2], gunler[3], gunler[4]] },
    { hedef: gunler[6], tip: 'en_tr', siklar: [gunler[0], gunler[4], gunler[5], gunler[6]] },
    { hedef: gunler[3], tip: 'ses', siklar: [gunler[1], gunler[2], gunler[3], gunler[5]] },
    { hedef: gunler[5], tip: 'tr_en', siklar: [gunler[2], gunler[3], gunler[4], gunler[5]] },
    { hedef: gunler[0], tip: 'en_tr', siklar: [gunler[0], gunler[1], gunler[5], gunler[6]] },
    { hedef: gunler[1], tip: 'ses', siklar: [gunler[0], gunler[1], gunler[3], gunler[4]] },
    { hedef: gunler[4], tip: 'tr_en', siklar: [gunler[1], gunler[2], gunler[4], gunler[6]] },
    { hedef: gunler[2], tip: 'en_tr', siklar: [gunler[2], gunler[3], gunler[4], gunler[5]] },
    { hedef: gunler[3], tip: 'tr_en', siklar: [gunler[0], gunler[1], gunler[2], gunler[3]] },
    { hedef: gunler[6], tip: 'ses', siklar: [gunler[0], gunler[4], gunler[5], gunler[6]] },
    { hedef: gunler[5], tip: 'en_tr', siklar: [gunler[2], gunler[4], gunler[5], gunler[6]] },
    { hedef: gunler[0], tip: 'ses', siklar: [gunler[0], gunler[1], gunler[3], gunler[4]] },
    { hedef: gunler[1], tip: 'tr_en', siklar: [gunler[0], gunler[1], gunler[2], gunler[5]] },
    { hedef: gunler[4], tip: 'en_tr', siklar: [gunler[2], gunler[3], gunler[4], gunler[6]] },
    { hedef: gunler[2], tip: 'ses', siklar: [gunler[1], gunler[2], gunler[3], gunler[4]] },
    { hedef: gunler[3], tip: 'en_tr', siklar: [gunler[0], gunler[1], gunler[3], gunler[5]] },
    { hedef: gunler[6], tip: 'tr_en', siklar: [gunler[1], gunler[4], gunler[5], gunler[6]] }
  ];

  var can = 5;
  var secilenIndex = -1;
  var kontrolEdildi = false;

  function ipucuGoster() {
    var alan = document.getElementById('ipucu-metni');
    alan.style.display = (alan.style.display === 'block') ? 'none' : 'block';
  }

  function sesCal() {
    if ('speechSynthesis' in window && kuyruk.length > 0) {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(kuyruk[0].hedef.en);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }
  }

  function secimYap(index) {
    if (kontrolEdildi) return;
    secilenIndex = index;
    for (var i = 0; i < 4; i++) {
      document.getElementById('btn-' + i).classList.remove('secildi');
    }
    document.getElementById('btn-' + index).classList.add('secildi');
    document.getElementById('kontrol-butonu').disabled = false;
  }

  function soruyuCiz() {
    kontrolEdildi = false;
    secilenIndex = -1;

    document.getElementById('bildirim').style.display = 'none';
    var anaBtn = document.getElementById('kontrol-butonu');
    anaBtn.textContent = 'KONTROL ET';
    anaBtn.disabled = true;

    var cur = kuyruk[0];
    document.getElementById('kalan-sayisi').textContent = 'Kalan Soru: ' + kuyruk.length;
    document.getElementById('can-sayisi').textContent = '❤️ ' + can;

    var ipucu = document.getElementById('ipucu-metni');
    ipucu.style.display = 'none';
    ipucu.textContent = '💡 İpucu: ' + cur.hedef.hint;

    var sesAlani = document.getElementById('ses-alani');
    var isTr = (cur.tip === 'en_tr' || cur.tip === 'ses');

    if (cur.tip === 'tr_en') {
      document.getElementById('soru-metni').textContent = '"' + cur.hedef.tr + '" hangisidir?';
      sesAlani.style.display = 'none';
    } else if (cur.tip === 'en_tr') {
      document.getElementById('soru-metni').textContent = '"' + cur.hedef.en + '" ne demek?';
      sesAlani.style.display = 'none';
    } else {
      document.getElementById('soru-metni').textContent = 'Sesi dinleyin ve doğru günü seçin:';
      sesAlani.style.display = 'block';
    }

    for (var i = 0; i < 4; i++) {
      var btn = document.getElementById('btn-' + i);
      btn.className = 'secenek';
      btn.textContent = isTr ? cur.siklar[i].tr : cur.siklar[i].en;
    }
  }

  function butonaBasildi() {
    var cur = kuyruk[0];
    var anaBtn = document.getElementById('kontrol-butonu');
    var bildirim = document.getElementById('bildirim');

    if (!kontrolEdildi) {
      kontrolEdildi = true;
      var secilenSik = cur.siklar[secilenIndex];
      var dogruMu = (secilenSik.en === cur.hedef.en);

      bildirim.style.display = 'block';

      for (var i = 0; i < 4; i++) {
        var btn = document.getElementById('btn-' + i);
        if (cur.siklar[i].en === cur.hedef.en) {
          btn.classList.add('dogru');
        } else if (i === secilenIndex) {
          btn.classList.add('yanlis');
        }
      }

      if (dogruMu) {
        bildirim.className = 'mesaj-alani dogru';
        bildirim.innerHTML = '<strong>Tebrikler! Doğru.</strong><br>' + cur.hedef.en + ' = ' + cur.hedef.tr;
        anaBtn.textContent = 'DEVAM ET';
        kuyruk.shift();
      } else {
        can--;
        document.getElementById('can-sayisi').textContent = '❤️ ' + Math.max(0, can);
        bildirim.className = 'mesaj-alani yanlis';
        bildirim.innerHTML = '<strong>Yanlış! Bu soru en sona eklendi.</strong><br>Doğrusu: <strong>' + cur.hedef.en + '</strong> (' + cur.hedef.tr + ')';
        anaBtn.textContent = 'SONA EKLE & DEVAM ET';

        var yanlisSoru = kuyruk.shift();
        yanlisSoru.siklar.sort(function() { return 0.5 - Math.random(); });
        kuyruk.push(yanlisSoru);
      }
    } else {
      if (can <= 0) {
        alert("Canlarınız tükendi! Test yeniden başlıyor.");
        location.reload();
        return;
      }

      if (kuyruk.length > 0) {
        soruyuCiz();
      } else {
        document.getElementById('oyun-alani').style.display = 'none';
        document.getElementById('bildirim').style.display = 'none';
