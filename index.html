<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İngilizce Günler</title>
  <style>
    body {
      background-color: #121f24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .kutu {
      background-color: #1f2e35;
      border: 2px solid #37464f;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
    }
    .ust-bilgi {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #58cc02;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .can { color: #ff4b4b; }
    .soru-baslik {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 25px;
    }
    .ipucu-alani {
      font-size: 13px;
      color: #ffc800;
      background: #18252a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .ipucu-btn {
      color: #afc5ce;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 15px;
    }
    .ses-kutusu {
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }
    .ses-butonu {
      background: #1cb0f6;
      border: none;
      color: white;
      font-size: 28px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
    }
    .secenekler {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }
    .secenek {
      background-color: #2b3940;
      color: #ffffff;
      border: 2px solid #37464f;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }
    .secenek.secildi {
      border-color: #1cb0f6 !important;
      background-color: #1a3847 !important;
    }
    .secenek.dogru {
      border-color: #58cc02 !important;
      background-color: #1e3b22 !important;
      color: #58cc02 !important;
    }
    .secenek.yanlis {
      border-color: #ff4b4b !important;
      background-color: #401e1e !important;
      color: #ff4b4b !important;
    }
    .mesaj-alani {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }
    .mesaj-alani.dogru {
      background: rgba(88, 204, 2, 0.2);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .mesaj-alani.yanlis {
      background: rgba(255, 75, 75, 0.2);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }
    .ana-buton {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background-color: #58cc02;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    .ana-buton.pasif {
      background-color: #37464f;
      color: #6a828e;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="kutu">
  <div class="ust-bilgi">
    <span id="kalan-sayisi">Kalan Soru: 20</span>
    <span class="can" id="can-sayisi">❤️ 5</span>
  </div>
