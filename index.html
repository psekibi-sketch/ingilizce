<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İngilizce Günler Pratiği</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 15px;
      color: var(--text-muted);
    }
    .progress-bar-bg {
      background: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .question-prompt {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 24px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-opt {
      background: #273549;
      color: var(--text);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 18px 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn-opt:active { transform: scale(0.98); }
    .btn-opt.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: var(--success); }
    .btn-opt.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: var(--error); }
    
    .action-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }
    .btn-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 30px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      transition: all 0.2s;
    }
    .btn-circle:active { transform: scale(0.94); }
    .btn-circle.listening {
      background: var(--error);
      box-shadow: 0 0 0 10px rgba(239, 68, 68, 0.3);
      animation: pulse 1.5s infinite;
      color: white;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .hint-text { font-size: 14px; color: var(--text-muted); text-align: center; }
    .feedback-box {
      min-height: 28px;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      margin-top: 10px;
    }
    .btn-next, .btn-restart {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      margin-top: 16px;
    }
    .result-score { font-size: 54px; font-weight: 800; color: var(--accent); text-align: center; margin: 16px 0 8px; }
  </style>
</head>
<body>

<div class="container" id="app">
  <div class="header">
    <span id="question-index">Soru 1 / 20</span>
    <span id="score-counter">Doğru: 0</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-fill" id="progress-bar"></div>
  </div>

  <div id="quiz-area">
    <div style="text-align: center;"><span class="badge" id="type-badge">Çeviri</span></div>
    <div class="question-prompt" id="prompt-text">Loading...</div>

    <div class="action-panel" id="action-panel" style="display: none;">
      <button class="btn-circle" id="action-btn" aria-label="Eylem">🔊</button>
      <div class="hint-text" id="action-hint">Dinlemek için dokunun</div>
    </div>

    <div class="options-grid" id="options-container"></div>
    <div class="feedback-box" id="feedback-text"></div>
    <button class="btn-next" id="next-btn" onclick="nextQuestion()">Sonraki Soru ➔</button>
  </div>

  <div id="result-area" style="display: none; text-align: center;">
    <h2 style="font-size: 26px;">Tebrikler! Test Tamamlandı</h2>
    <div class="result-score" id="percent-text">%0</div>
    <p id="result-summary" style="color: var(--text-muted); font-size: 16px; margin-bottom: 24px;">20 sorudan 0 tanesini doğru yanıtladınız.</p>
    <button class="btn-restart" style="display: block;" onclick="initQuiz()">🔄 Testi Yeniden Başlat</button>
  </div>
</div>

<script>
  const days = [
    { en: 'Monday', tr: 'Pazartesi' },
    { en: 'Tuesday', tr: 'Salı' },
    { en: 'Wednesday', tr: 'Çarşamba' },
    { en: 'Thursday', tr: 'Perşembe' },
    { en: 'Friday', tr: 'Cuma' },
    { en: 'Saturday', tr: 'Cumartesi' },
    { en: 'Sunday', tr: 'Pazar' }
  ];

  let questions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let answered = false;

  function shuffle(array) {
    return array.slice().sort(() => Math.random() - 0.5);
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function generate20Questions() {
    const list = [];
    const types = ['en-to-tr', 'tr-to-en', 'listening', 'speaking'];

    for (let i = 0; i < 20; i++) {
      const target = days[Math.floor(Math.random() * days.length)];
      const qType = types[i % types.length]; // 4 tip dengeli dağıtılır
      
      const wrongDays = days.filter(d => d.en !== target.en);
      const chosenWrongs = shuffle(wrongDays).slice(0, 3);
      const allChoices = shuffle([target, ...chosenWrongs]);

      list.push({
        type: qType,
        target: target,
        choices: allChoices
      });
    }
    return shuffle(list);
  }

  function initQuiz() {
    questions = generate20Questions();
    currentIndex = 0;
    correctCount = 0;
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('result-area').style.display = 'none';
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = questions[currentIndex];
    const total = questions.length;

    document.getElementById('question-index').textContent = `Soru ${currentIndex + 1} / ${total}`;
    document.getElementById('score-counter').textContent = `Doğru: ${correctCount}`;
    document.getElementById('progress-bar').style.width = `${((currentIndex) / total) * 100}%`;
    document.getElementById('feedback-text').textContent = '';
    document.getElementById('next-btn').style.display = 'none';

    const prompt = document.getElementById('prompt-text');
    const badge = document.getElementById('type-badge');
    const optsContainer = document.getElementById('options-container');
    const actionPanel = document.getElementById('action-panel');
    const actionBtn = document.getElementById('action-btn');
    const actionHint = document.getElementById('action-hint');

    optsContainer.innerHTML = '';
    actionPanel.style.display = 'none';
    optsContainer.style.display = 'grid';

    if (q.type === 'en-to-tr') {
      badge.textContent = 'İngilizce ➔ Türkçe';
      prompt.textContent = `"${q.target.en}" Türkçe ne demek?`;
      renderOptionButtons(q.choices.map(c => ({ label: c.tr, isCorrect: c.en === q.target.en })));
    } 
    else if (q.type === 'tr-to-en') {
      badge.textContent = 'Türkçe ➔ İngilizce';
      prompt.textContent = `"${q.target.tr}" İngilizce nasıl denir?`;
      renderOptionButtons(q.choices.map(c => ({ label: c.en, isCorrect: c.en === q.target.en })));
    } 
    else if (q.type === 'listening') {
      badge.textContent = 'Dinle & Seç';
      prompt.textContent = 'Sesi dinleyin ve doğru günü seçin';
      actionPanel.style.display = 'flex';
      actionBtn.textContent = '🔊';
      actionBtn.className = 'btn-circle';
      actionHint.textContent = 'Tekrar dinlemek için dokunun';
      actionBtn.onclick = () => speakText(q.target.en);
      speakText(q.target.en);
      renderOptionButtons(q.choices.map(c => ({ label: c.en, isCorrect: c.en === q.target.en })));
    } 
    else if (q.type === 'speaking') {
      badge.textContent = 'Telaffuz / Konuşma';
      prompt.textContent = `Bu günü İngilizce söyleyin: "${q.target.tr}"`;
      actionPanel.style.display = 'flex';
      optsContainer.style.display = 'none';
      actionBtn.textContent = '🎙️';
      actionBtn.className = 'btn-circle';
      actionHint.textContent = 'Mikrofona basıp İngilizce söyleyin';
      actionBtn.onclick = () => startListening(q.target.en);
    }
  }

  function renderOptionButtons(options) {
    const container = document.getElementById('options-container');
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.textContent = opt.label;
      btn.onclick = () => checkAnswer(opt.isCorrect, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(isCorrect, selectedBtn) {
    if (answered) return;
    answered = true;

    const feedback = document.getElementById('feedback-text');
    const buttons = document.querySelectorAll('.btn-opt');

    if (isCorrect) {
      correctCount++;
      if (selectedBtn) selectedBtn.classList.add('correct');
      feedback.textContent = '✓ Harika! Doğru cevap.';
      feedback.style.color = 'var(--success)';
    } else {
      if (selectedBtn) selectedBtn.classList.add('wrong');
      const q = questions[currentIndex];
      const correctVal = (q.type === 'en-to-tr') ? q.target.tr : q.target.en;
      buttons.forEach(b => {
        if (b.textContent === correctVal) b.classList.add('correct');
      });
      feedback.textContent = `✗ Yanlış. Doğru cevap: ${correctVal}`;
      feedback.style.color = 'var(--error)';
    }

    document.getElementById('score-counter').textContent = `Doğru: ${correctCount}`;
    document.getElementById('next-btn').style.display = 'block';
  }

  function startListening(expectedWord) {
    if (answered) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('feedback-text').textContent = 'Tarayıcınız ses tanımayı desteklemiyor. Geçildi sayıldı.';
      checkAnswer(true, null);
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const actionBtn = document.getElementById('action-btn');
    const actionHint = document.getElementById('action-hint');
    actionBtn.classList.add('listening');
    actionHint.textContent = 'Sizi dinliyor... Şimdi konuşun';

    recognition.onresult = (event) => {
      actionBtn.classList.remove('listening');
      const spoken = event.results[0][0].transcript.trim().toLowerCase();
      const expected = expectedWord.toLowerCase();

      if (spoken.includes(expected)) {
        checkAnswer(true, null);
      } else {
        const feedback = document.getElementById('feedback-text');
        feedback.textContent = `Duyulan: "${spoken}". Beklenen: "${expectedWord}"`;
        checkAnswer(false, null);
      }
    };

    recognition.onerror = () => {
      actionBtn.classList.remove('listening');
      actionHint.textContent = 'Ses alınamadı. Mikrofon izinlerini kontrol edin veya tekrar deneyin.';
    };

    recognition.onend = () => {
      actionBtn.classList.remove('listening');
    };

    recognition.start();
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      renderQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('progress-bar').style.width = '100%';

    const percent = Math.round((correctCount / questions.length) * 100);
    document.getElementById('percent-text').textContent = `%${percent}`;
    document.getElementById('result-summary').textContent = 
      `${questions.length} sorudan ${correctCount} tanesini doğru tamamladınız.`;
  }

  // İlk başlatma
  initQuiz();
</script>

</body>
</html>
