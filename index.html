<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #121f24;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      user-select: none;
    }
    .kutu {
      background: #1f2e35;
      border: 2px solid #37464f;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .ust-panel {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      color: #58cc02;
      margin-bottom: 16px;
    }
    .can-kutu { color: #ff4b4b; }
    .soru-metni {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      min-height: 28px;
    }
    .ipucu-link {
      font-size: 13px;
      color: #afc5ce;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 14px;
    }
    .ipucu-panel {
      background: #18252a;
      border: 1px dashed #4b626e;
      color: #ffc800;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .ses-kutusu {
      text-align: center;
      margin-bottom: 16px;
    }
    .ses-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #1cb0f6;
      border: none;
      color: #ffffff;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .ses-btn:active { transform: scale(0.95); }
    .siklar-kutusu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .sik-btn {
      background: #2b3940;
      border: 2px solid #37464f;
      border-radius: 14px;
      padding: 15px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .sik-btn:active { transform: translateY(1px); }
    .sik-btn.secildi {
      border-color: #1cb0f6 !important;
      background: #1a3847 !important;
      color: #1cb0f6 !important;
    }
    .sik-btn.dogru {
      border-color: #58cc02 !important;
      background: #1e3b22 !important;
      color: #58cc02 !important;
    }
    .sik-btn.yanlis {
      border-color: #ff4b4b !important;
      background: #401e1e !important;
      color: #ff4b4b !important;
    }
    .sonuc-mesaji {
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 14px;
      display: none;
    }
    .sonuc-mesaji.dogru {
      background: rgba(88, 204, 2, 0.2);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .sonuc-mesaji.yanlis {
      background: rgba(255, 75, 75, 0.2);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }
    .ana-btn {
      width: 100%;
      background: #58cc02;
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .ana-btn:active { transform: scale(0.98); }
    .ana-btn.pasif {
      background: #37464f;
      color: #6a828e;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="kutu">
  <div class="ust-panel">
    <span id="kalan-txt">Kalan: 20</span>
    <span class="can-kutu" id="can-txt">❤️ 5</span>
  </div>

  <div id="ana-ekran">

    <span class="ipucu-link" id="ipucu-ac-btn">💡 İpucu ister misin?</span>
    <div class="ipucu-panel" id="ipucu-kutu"></div>

    <div class="ses-kutusu" id="ses-kutusu" style="display: none;">

      <div style="font-size: 12px; color: #afc5ce; margin-top: 6px;">Dinlemek için dokunun</div>
    </div>

    <div class="siklar-kutusu" id="siklar-alani"></div>
  </div>

  <div class="sonuc-mesaji" id="mesaj-kutusu"></div>
