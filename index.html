<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoDays - 2. Sınıf Theme 2: Classroom Life</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #334155;
      --primary: #38bdf8;
      --success: #10b981;
      --error: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 800; color: #fff; }
    .header p { font-size: 13px; color: var(--primary); }
    .timer-badge { background: #1e293b; border: 1px solid var(--primary); padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; color: var(--primary); }
    
    /* Tabs */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .tab-btn { background: var(--card-bg); color: var(--muted); border: 1px solid var(--card-inner); padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 600; font-size: 13px; }
    .tab-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); font-weight: 800; }
    
    /* Card */
    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--card-inner); }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: bold; }
    .reset-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .reset-btn:hover { background: var(--primary); color: #0f172a; }
    
    /* Item row */
    .item-box { background: var(--card-inner); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .speak-btn { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    
    /* Options */
    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .opt-btn { background: #1e293b; color: white; border: 2px solid transparent; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.2s; }
    .opt-btn.correct { background: var(--success); border-color: #059669; }
    .opt-btn.wrong { background: var(--error); border-color: #b91c1c; }
    
    .status-msg { margin-top: 8px; font-size: 12px; font-weight: bold; }
    .status-msg.error { color: var(--error); }
    .status-msg.success { color: var(--success); }
    
    .cipher-box { background: #0f172a; padding: 14px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; letter-spacing: 2px; color: #f472b6; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <h1>📖 2. Sınıf İngilizce Kitabı</h1>
        <p>2. Ünite: CLASSROOM LIFE (Sayfa 17 - 24)</p>
      </div>
      <div id="studyTimer" class="timer-badge">⏱️ 00:00</div>
    </div>

    <!-- Page Tabs -->
    <div class="tabs" id="pageTabs">
      <button class="tab-btn active" onclick="switchPage(17)">Sayfa 17 (Kapak)</button>
      <button class="tab-btn" onclick="switchPage(18)">Sayfa 18 (Eşyalar)</button>
      <button class="tab-btn" onclick="switchPage(19)">Sayfa 19 (Rehber)</button>
      <button class="tab-btn" onclick="switchPage(20)">Sayfa 20 (Şifre)</button>
      <button class="tab-btn" onclick="switchPage(21)">Sayfa 21 (Boya)</button>
      <button class="tab-btn" onclick="switchPage(22)">Sayfa 22 (Matematik)</button>
      <button class="tab-btn" onclick="switchPage(23)">Sayfa 23 (Hikaye)</button>
      <button class="tab-btn" onclick="switchPage(24)">Sayfa 24 (Kaç Tane?)</button>
    </div>

    <!-- Page Contents -->
    <div id="pageContainer"></div>
  </div>

  <script>
    // Seslendirme Motoru
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }
    }

    // 10 Saniye Hareketsizlik Algılayan Çalışma Sayacı
    let studySeconds = 0;
    let lastActivity = Date.now();
    setInterval(() => {
      if (Date.now() - lastActivity <= 10000) {
        studySeconds++;
        const mins = String(Math.floor(studySeconds / 60)).padStart(2, '0');
        const secs = String(studySeconds % 60).padStart(2, '0');
        document.getElementById('studyTimer').innerText = `⏱️ ${mins}:${secs}`;
      }
    }, 1000);
    window.addEventListener('click', () => { lastActivity = Date.now(); });

    // Sayfa 18 Verileri
    const page18Data = [
      { id: 1, correct: "a pencil case", tr: "kalem kutusu", ph: "e pensıl keys", emoji: "👝", opts: ["a desk", "a pencil case", "a sharpener"] },
      { id: 2, correct: "a ruler", tr: "cetvel", ph: "e ruulır", emoji: "📏", opts: ["scissors", "a ruler", "a crayon"] },
      { id: 3, correct: "a chair", tr: "sandalye", ph: "e çeer", emoji: "🪑", opts: ["a computer", "a clock", "a chair"] },
      { id: 4, correct: "a whiteboard", tr: "yazı tahtası", ph: "e vaytbord", emoji: "📋", opts: ["a table", "a whiteboard", "a window"] },
      { id: 5, correct: "a bookcase", tr: "kitaplık", ph: "e buk-keys", emoji: "📚", opts: ["a bookcase", "a wall", "a door"] },
      { id: 6, correct: "a notebook", tr: "defter", ph: "e nootbuk", emoji: "📓", opts: ["a tablet", "a rubber", "a notebook"] }
    ];

    let p18Answers = {};
    let activePage = 18;

    function renderPage18() {
      let html = `
        <div class="card">
          <div class="card-title-row">
            <div>
              <div class="card-title">Sayfa 18: Listen and Choose</div>
              <div style="font-size:12px;color:var(--muted)">Çocuk kendisi doğruyu bulana kadar diğer şıkları deneyebilir!</div>
            </div>
            <button class="reset-btn" onclick="resetP18()">🔄 Dersi Sıfırla</button>
          </div>
      `;

      page18Data.forEach(item => {
        const userChoice = p18Answers[item.id];
        const isAnswered = userChoice !== undefined;
        const isCorrect = userChoice === item.correct;

        html += `
          <div class="item-box">
            <div class="item-header">
              <div>
                <span style="font-size:24px">${item.emoji}</span>
                <strong>${isCorrect ? item.correct : 'Doğruyu Seç'}</strong>
                <div style="font-size:12px;color:var(--primary)">${item.tr} • [${item.ph}]</div>
              </div>
              <button class="speak-btn" onclick="speak('${item.correct}')">🔊 Dinle</button>
            </div>
            <div class="options-grid">
        `;

        item.opts.forEach(opt => {
          let cls = 'opt-btn';
          if (userChoice === opt) {
            cls += (opt === item.correct) ? ' correct' : ' wrong';
          }
          html += `<button class="${cls}" onclick="checkP18(${item.id}, '${opt}')">${opt}</button>`;
        });

        html += `</div>`;
        if (isAnswered && !isCorrect) {
          html += `<div class="status-msg error">❌ Yanlış şık! Lütfen doğru cevabı kendin bulana kadar tekrar dene.</div>`;
        } else if (isCorrect) {
          html += `<div class="status-msg success">✓ Aferin! Doğru cevap!</div>`;
        }
        html += `</div>`;
      });

      html += `</div>`;
      document.getElementById('pageContainer').innerHTML = html;
    }

    function checkP18(id, opt) {
      speak(opt);
      p18Answers[id] = opt;
      renderPage18();
    }

    function resetP18() {
      p18Answers = {};
      renderPage18();
    }

    // Sayfa 20: Şifre
    function renderPage20() {
      document.getElementById('pageContainer').innerHTML = `
        <div class="card">
          <div class="card-title-row">
            <div class="card-title">Sayfa 20: Gizli Çiçek Şifresi & Yönergeler</div>
            <button class="reset-btn" onclick="renderPage20()">🔄 Dersi Sıfırla</button>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Öğretmenin sınıf yönergeleri ve kitaptaki gizli çiçek şifresi:</p>
          <div class="cipher-box">🌸 GİZLİ SORU: CAN I OPEN THE DOOR?</div>
          <button class="speak-btn" style="width:100%;padding:12px;" onclick="speak('Can I open the door, please?')">🔊 "Can I open the door, please?" Dinle</button>
        </div>
      `;
    }

    // Sayfa Değiştirici
    function switchPage(page) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      activePage = page;
      if (page === 18) renderPage18();
      else if (page === 20) renderPage20();
      else {
        document.getElementById('pageContainer').innerHTML = `
          <div class="card">
            <div class="card-title-row">
              <div class="card-title">Sayfa ${page}</div>
              <button class="reset-btn" onclick="switchPage(${page})">🔄 Dersi Sıfırla</button>
            </div>
            <p style="font-size:13px;color:var(--muted)">Sayfa ${page} içeriği Android uygulamanızda tam interaktif olarak mevcuttur.</p>
          </div>
        `;
      }
    }

    // Başlangıçta Sayfa 18'i yükle
    renderPage18();
  </script>
</body>
</html>
