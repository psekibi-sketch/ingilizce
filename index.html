<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #131f24;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #202f36;
      border: 2px solid #37464f;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .track {
      flex: 1;
      height: 12px;
      background: #37464f;
      border-radius: 10px;
      overflow: hidden;
      margin-right: 14px;
    }
    .fill {
      width: 5%;
      height: 100%;
      background: #58cc02;
      transition: width 0.3s ease;
    }
    .hearts {
      font-size: 18px;
      font-weight: 800;
      color: #ff4b4b;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .tag {
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .queue-info {
      font-size: 13px;
      color: #afc5ce;
      font-weight: 700;
    }
    .title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.3;
      min-height: 30px;
    }
    .hint-trigger {
      display: inline-block;
      font-size: 13px;
      color: #afc5ce;
      cursor: pointer;
      margin-bottom: 12px;
      text-decoration: underline;
    }
    .hint-box {
      background: #18282f;
      border: 1px dashed #4b626e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      color: #ffc800;
      display: none;
    }
    .sound-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .sound-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #1cb0f6;
      border: none;
      border-bottom: 4px solid #1899d6;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sound-btn:active { transform: translateY(2px); }
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .opt {
      background: #27373f;
      border: 2px solid #37464f;
      border-bottom: 4px solid #37464f;
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .opt:active { transform: translateY(2px); border-bottom-width: 2px; }
    .opt.sel {
      border-color: #1cb0f6;
      border-bottom-color: #1899d6;
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
    }
    .opt.correct-mark {
      border-color: #58cc02 !important;
      border-bottom-color: #58a700 !important;
      background: rgba(88, 204, 2, 0.2) !important;
      color: #58cc02 !important;
    }
    .opt.wrong-mark {
      border-color: #ff4b4b !important;
      border-bottom-color: #ea2b2b !important;
      background: rgba(255, 75, 75, 0.2) !important;
      color: #ff4b4b !important;
    }
    .feedback {
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .feedback.ok {
      background: rgba(88, 204, 2, 0.15);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .feedback.err {
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }
    .main-btn {
      width: 100%;
      background: #58cc02;
      border: none;
      border-bottom: 4px solid #58a700;
      color: white;
      font-size: 17px;
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .main-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .main-btn.disabled {
      background: #37464f;
      border-bottom-color: #27333a;
      color: #6a828e;
      pointer-events: none;
    }
    
    /* İstatistik Tablosu */
    .stat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
      text-align: left;
    }
    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }
    .stat-bar-bg {
      height: 8px;
      background: #18282f;
      border-radius: 6px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Üst Göstergeler -->
  <div class="top-bar">
    <div class="track"><div class="fill" id="fill-bar"></div></div>
    <div class="hearts">❤️ <span id="hearts-val">5</span></div>
  </div>

  <!-- Soru İçeriği -->
  <div id="quiz-panel">
    <div class="info-row">
      <span class="tag" id="tag-badge">SORU</span>
      <span class="queue-info" id="queue-indicator">Kalan: 20</span>
    </div>

    <div class="title" id="question-text">Soru hazırlanıyor...</div>
    
    <div class="hint-trigger" id="hint-btn" onclick="toggleHint()">💡 İpucu ister misin?</div>
    <div class="hint-box" id="hint-display"></div>

    <div class="sound-panel" id="sound-box">
      <button class="sound-btn" type="button" onclick="playCurrentAudio()">🔊</button>
      <span style="font-size:12px; color:#afc5ce;">Tekrar dinlemek için dokunun</span>
    </div>

    <!-- 4 Sabit Şık Butonu (Dinamik çökme riskini önler) -->
    <div class="btn-col" id="options-group">
      <button class="opt" type="button" onclick="handleSelect(0)" id="opt-0"><span>-</span></button>
      <button class="opt" type="button" onclick="handleSelect(1)" id="opt-1"><span>-</span></button>
      <button class="opt" type="button" onclick="handleSelect(2)" id="opt-2"><span>-</span></button>
      <button class="opt" type="button" onclick="handleSelect(3)" id="opt-3"><span>-</span></button>
    </div>
  </div>

  <!-- Sonuç Rapor Alanı (Test Bitince Gösterilir) -->
  <div id="report-panel" style="display: none; text-align: center;">
    <div style="font-size:52px; margin-bottom:8px;">📊</div>
    <div class="title" style="color:#ffc800;">Performans Özeti</div>
    <div class="stat-list" id="stat-container"></div>
  </div>

  <!-- Geri Bildirim ve İlerleme Butonu -->
  <div class="feedback" id="feedback-alert"></div>
  <button class="main-btn disabled" id="submit-btn" onclick="processStep()">KONTROL ET</button>
</div>

<script>
  var daysData = [
    { en: 'Monday', tr: 'Pazartesi', icon: '🌙', hint: 'Moon-day (Ay günü) - Haftanın 1. günü' },
    { en: 'Tuesday', tr: 'Salı', icon: '⚔️', hint: 'Two-sday (2. gün) - İkinci iş günü' },
    { en: 'Wednesday', tr: 'Çarşamba', icon: '🐪', hint: 'Hump Day (Hafta ortası) - En uzun yazılan gün' },
    { en: 'Thursday', tr: 'Perşembe', icon: '⚡', hint: 'Thor-sday (Şimşek günü) - Cuma öncesi' },
    { en: 'Friday', tr: 'Cuma', icon: '🍟', hint: 'Fri-day (Fries/Patates) - Hafta sonu kapısı' },
    { en: 'Saturday', tr: 'Cumartesi', icon: '🪐', hint: 'Saturn-day - Hafta sonu başlangıcı' },
    { en: 'Sunday', tr: 'Pazar', icon: '☀️', hint: 'Sun-day (Güneş günü) - Dinlenme günü' }
  ];

  var queue = [];
  var targetGoal = 20;
  var completedCount = 0;
  var hearts = 5;
  var selectedIndex = -1;
  var isEvaluated = false;
  var performanceLog = {};

  // İstatistik havuzunu hazırla
  for (var i = 0; i < daysData.length; i++) {
    performanceLog[daysData[i].en] = { attempts: 0, wrongs: 0, tr: daysData[i].tr, icon: daysData[i].icon };
  }

  function playAudio(word) {
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    } catch(e) {}
  }

  function playCurrentAudio() {
    if (queue.length > 0) {
      playAudio(queue[0].target.en);
    }
  }

  function shuffle(arr) {
    var c = arr.slice();
    for (var i = c.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = c[i]; c[i] = c[j]; c[j] = t;
    }
    return c;
  }

  function buildQuestion(targetItem, mode) {
    var wrongPool = daysData.filter(function(x) { return x.en !== targetItem.en; });
    var wrongs = shuffle(wrongPool).slice(0, 3);
    var choices = shuffle([targetItem].concat(wrongs));
    return { target: targetItem, mode: mode, choices: choices };
  }

  function setupQuiz() {
    queue = [];
    completedCount = 0;
    hearts = 5;
    var modes = ['tr_to_en', 'en_to_tr', 'sound'];
    for (var i = 0; i < targetGoal; i++) {
      var item = daysData[i % daysData.length];
      var m = modes[i % modes.length];
      queue.push(buildQuestion(item, m));
    }
    queue = shuffle(queue);
    renderQuestion();
  }

  function toggleHint() {
    var h = document.getElementById('hint-display');
    h.style.display = (h.style.display === 'block') ? 'none' : 'block';
  }

  function handleSelect(idx) {
    if (isEvaluated) return;
    selectedIndex = idx;
    for (var i = 0; i < 4; i++) {
      var b = document.getElementById('opt-' + i);
      if (b) b.classList.remove('sel');
    }
    var selectedBtn = document.getElementById('opt-' + idx);
    if (selectedBtn) selectedBtn.classList.add('sel');

    var submitBtn = document.getElementById('submit-btn');
    submitBtn.classList.remove('disabled');
  }

  function renderQuestion() {
    isEvaluated = false;
    selectedIndex = -1;

    var fb = document.getElementById('feedback-alert');
    fb.style.display = 'none';

    var submitBtn = document.getElementById('submit-btn');
    submitBtn.textContent = 'KONTROL ET';
    submitBtn.className = 'main-btn disabled';

    var currentQ
