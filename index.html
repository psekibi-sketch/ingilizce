<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LingoDays - İngilizce Günler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #131f24;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .app-card {
      width: 100%;
      max-width: 480px;
      background: #202f36;
      border: 2px solid #37464f;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .progress-track {
      flex: 1;
      height: 12px;
      background: #37464f;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      width: 5%;
      height: 100%;
      background: #58cc02;
      transition: width 0.3s ease;
    }
    .hearts {
      font-size: 18px;
      font-weight: 800;
      color: #ff4b4b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(28, 176, 246, 0.2);
      color: #1cb0f6;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .prompt-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .mnemonic-box {
      background: #18282f;
      border: 2px dashed #4b626e;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .mnemonic-icon { font-size: 42px; }
    .mnemonic-word { font-size: 20px; font-weight: 800; color: #1cb0f6; }
    .mnemonic-sub { font-size: 13px; color: #afc5ce; margin-top: 2px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .opt-btn {
      background: #27373f;
      border: 2px solid #37464f;
      border-bottom: 4px solid #37464f;
      border-radius: 14px;
      padding: 14px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .opt-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .opt-btn.selected {
      border-color: #1cb0f6;
      border-bottom-color: #1899d6;
      background: rgba(28, 176, 246, 0.15);
      color: #1cb0f6;
    }

    .mic-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }
    .circle-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #1cb0f6;
      border: none;
      border-bottom: 4px solid #1899d6;
      font-size: 32px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn:active { transform: translateY(2px); }
    .circle-btn.listening {
      background: #ff4b4b;
      border-bottom-color: #ea2b2b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .bottom-feedback {
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .bottom-feedback.correct {
      background: rgba(88, 204, 2, 0.15);
      border: 1px solid #58cc02;
      color: #58cc02;
    }
    .bottom-feedback.wrong {
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid #ff4b4b;
      color: #ff4b4b;
    }

    .action-btn {
      width: 100%;
      background: #58cc02;
      border: none;
      border-bottom: 4px solid #58a700;
      color: white;
      font-size: 17px;
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .action-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .action-btn.disabled {
      background: #37464f;
      border-bottom-color: #27333a;
      color: #6a828e;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="app-card">
  <div class="top-bar">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="hearts">❤️ <span id="hearts-count">5</span></div>
  </div>

  <div id="exercise-box"></div>
  <div class="bottom-feedback" id="feedback-box"></div>
  <button class="action-btn disabled" id="action-btn" onclick="onActionClick()">KONTROL ET</button>
</div>

    { en: 'Tuesday', tr: 'Salı', icon: '⚔️', hint: 'Two-sday ➔ Haftanın 2. günü' },
    { en: 'Wednesday', tr: 'Çarşamba', icon: '🧙‍♂️', hint: 'Wed-nes-day ➔ Ortadaki en uzun gün' },
    { en: 'Thursday', tr: 'Perşembe', icon: '⚡', hint: 'Thor-sday ➔ Şimşek Tanrısı Thor günü' },
    { en: 'Friday', tr: 'Cuma', icon: '🍟', hint: 'Fri-day (Fries) ➔ Hafta sonu neşesi' },
    { en: 'Saturday', tr: 'Cumartesi', icon: '🪐', hint: 'Saturn-day ➔ Satürn gezegeni günü' },
    { en: 'Sunday', tr: 'Pazar', icon: '☀️', hint: 'Sun-day (Güneş Günü) ➔ Dinlenme günü' }
  ];
